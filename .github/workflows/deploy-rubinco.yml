name: Deploy Rubinco Artifact

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: watchpoint-production-deploy
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: ./mvnw clean package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::751091659794:role/rubinco-github-actions-role
          aws-region: ap-northeast-1

      - name: Upload artifact to S3
        run: |
          JAR=target/rubinco.jar

          test -s "$JAR"

          echo "Uploading: $JAR"

          aws s3 cp "$JAR" \
            s3://rubinco-deploy-artifacts/watchpoint/app.jar

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-07f5fc4469269d315" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Rubinco" \
            --parameters 'commands=[
              "set -eu",
              "if [ \"$(systemctl show rubinco-watchpoint.service --property=User --value)\" != \"rubinco-web\" ]; then echo \"Prepare the restricted service drop-in and run daemon-reload before deployment; see docs/DOCKER_PERMISSIONS.md\" >&2; exit 1; fi",
              "sudo -u rubinco-web sudo -n /usr/local/sbin/rubinco-game-control statuses > /dev/null",
              "cd /home/ec2-user/rubinco/apps/watchpoint/app",
              "aws s3 cp s3://rubinco-deploy-artifacts/watchpoint/app.jar app.jar.tmp",
              "test -s app.jar.tmp",
              "chmod 0644 app.jar.tmp",
              "if [ -s app.jar ]; then cp -p app.jar app.previous.jar; fi",
              "mv app.jar.tmp app.jar",
              "if ! sudo systemctl restart rubinco-watchpoint.service; then if [ -s app.previous.jar ]; then cp -p app.previous.jar app.jar; sudo systemctl restart rubinco-watchpoint.service || true; fi; exit 1; fi",
              "for attempt in $(seq 1 60); do curl --fail --silent --connect-timeout 2 --max-time 5 --output /dev/null http://127.0.0.1:8082/ && exit 0; sleep 2; done",
              "sudo systemctl status rubinco-watchpoint.service --no-pager || true",
              "if [ -s app.previous.jar ]; then cp -p app.previous.jar app.jar; sudo systemctl restart rubinco-watchpoint.service || true; fi",
              "exit 1"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "i-07f5fc4469269d315"; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-07f5fc4469269d315" || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-07f5fc4469269d315"
