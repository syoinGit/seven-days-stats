    tables: ["あ、相席……でも、大丈夫です……", "お、おいしい……です……"]
    board: ["こ、この依頼なら……できるかも……", "人の多い依頼は……ちょっと……"]
    hearth: ["火のそば……ほっとします……", "だ、だれも見てないですよね……？"]
  cheerful_m:
