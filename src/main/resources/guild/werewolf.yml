      - "わしを吊っても、何も変わらんぞ。"
      - "{me}は長くこの村におる。人狼などではないわい。"
    vote:
      - "{t}に票を入れるとしよう。"
      - "すまんのう、{t}じゃ。"
      - "{t}に入れる。悪く思うな。"
  elder_f:
