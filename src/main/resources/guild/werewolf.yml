    counter: 待て待て、本物の占い師は{me}じゃ。
    suspect:
      - "{t}の目つきが、どうも気にかかるのう。"
      - "{t}、ちと口数が多すぎやせんか。"
      - "わしの勘では、{t}が怪しいのう。"
    defend:
