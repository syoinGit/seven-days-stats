# What residents say in the solo werewolf game (GuildWerewolf, /guild/werewolf), per voice group of guild/voices.yml.
# No AI: the game in the browser picks one of these by what the resident decided to do, and fills in the names.
#   {me}: their own first person (from their voice). {t}: the one it is about (the traveller is "旅の人").
#   greet: when the day's talk opens. co: claims to be the seer. white / black: the seer's result on {t}.
#   counter: someone else already claimed the seer. suspect: names {t} as suspicious. defend: when named themselves.
#   vote: their vote for {t}.
# A line may be a list: the game picks one of them each time.
version: "2026-10-28-werewolf-b"
lines:
  kid:
    greet:
      - "人狼なんて、ほんとにいるの？ {me}、こわいよ！"
      - "みんなで人狼をさがすんだよね？ {me}、がんばる！"
      - "夜になるの、やだなあ……"
    co: "{me}、占い師なんだよ！ ちゃんと占えるんだから！"
    white:
      - "{t}を占ったら、人間だったよ！"
      - "{t}は人間だったよ！ よかったー！"
    black:
      - "{t}を占ったら……人狼だった！ ほんとだよ！"
      - "{t}、人狼だよ！ {me}、見ちゃったもん！"
    counter: うそだよ！ ほんものの占い師は{me}なんだ！
    suspect:
      - "{t}、なんだかあやしいよ！"
      - "{t}、さっきからへんだよ！"
      - "{t}がうそついてる気がする！"
    defend:
      - "{me}、人狼じゃないよ！ しんじて！"
      - "ちがうもん！ {me}、なんにもしてないよ！"
      - "{me}をうたがうなんて、ひどいよ！"
    vote:
      - "{t}に入れるね。"
      - "{t}！ ごめんね！"
      - "えっと……{t}にする！"
  elder_m:
    greet:
      - "やれやれ、この村にも人狼が出たか。昔を思い出すのう。"
