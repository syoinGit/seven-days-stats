spring.application.name=seven-days-stats
spring.datasource.url=jdbc:postgresql://localhost:5432/seven_days_stats
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=WATCHPOINT_SESSION
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SEVEN_DAYS_* names are canonical. SEVENDAYS_* fallbacks keep existing EC2 files compatible.
app.sevendays.environment-name=${APP_ENVIRONMENT:${SEVENDAYS_ENVIRONMENT:local}}
app.sevendays.mode=${SEVEN_DAYS_LOG_SOURCE:${SEVENDAYS_MODE:file}}
app.sevendays.root=${SEVEN_DAYS_ROOT:${SEVENDAYS_ROOT:7dtd}}
app.sevendays.config-dir=${SEVEN_DAYS_CONFIG_DIRECTORY:${SEVENDAYS_CONFIG_DIR:}}
app.sevendays.data-dir=${SEVEN_DAYS_DATA_DIRECTORY:${SEVENDAYS_DATA_DIR:}}
app.sevendays.game-dir=${SEVEN_DAYS_GAME_DIRECTORY:${SEVENDAYS_GAME_DIR:}}
app.sevendays.import.startup-enabled=${SEVEN_DAYS_IMPORT_STARTUP_ENABLED:${SEVENDAYS_IMPORT_STARTUP_ENABLED:true}}
app.sevendays.import.scheduled-enabled=${SEVEN_DAYS_IMPORT_SCHEDULED_ENABLED:${SEVENDAYS_IMPORT_SCHEDULED_ENABLED:false}}
app.sevendays.import.fixed-delay-ms=${SEVEN_DAYS_IMPORT_FIXED_DELAY_MS:${SEVENDAYS_IMPORT_FIXED_DELAY_MS:600000}}
app.sevendays.log.dir=${SEVEN_DAYS_LOG_DIRECTORY:${SEVENDAYS_LOG_DIR:}}
app.sevendays.log.scheduled-enabled=${SEVEN_DAYS_LOG_SCHEDULED_ENABLED:${SEVENDAYS_LOG_SCHEDULED_ENABLED:false}}
app.sevendays.log.fixed-delay-ms=${SEVEN_DAYS_LOG_FIXED_DELAY_MS:${SEVENDAYS_LOG_FIXED_DELAY_MS:600000}}
app.sevendays.log.initial-delay-ms=${SEVEN_DAYS_LOG_INITIAL_DELAY_MS:${SEVENDAYS_LOG_INITIAL_DELAY_MS:600000}}
app.sevendays.log.server-metric-interval-minutes=${SEVEN_DAYS_LOG_SERVER_METRIC_INTERVAL_MINUTES:${SEVENDAYS_LOG_SERVER_METRIC_INTERVAL_MINUTES:1}}
app.sevendays.docker.enabled=${SEVEN_DAYS_DOCKER_LOG_ENABLED:${SEVENDAYS_DOCKER_LOG_ENABLED:true}}
app.sevendays.docker.container-name=${SEVEN_DAYS_CONTAINER_NAME:${SEVENDAYS_DOCKER_CONTAINER_NAME:7dtd}}
app.sevendays.docker.log-since=${SEVEN_DAYS_DOCKER_LOG_SINCE:${SEVENDAYS_DOCKER_LOG_SINCE:5m}}
app.sevendays.docker.reconnect-delay-ms=${SEVENDAYS_DOCKER_RECONNECT_DELAY_MS:5000}
app.sevendays.docker.reconnect-delay-seconds=${SEVEN_DAYS_DOCKER_LOG_RESTART_DELAY_SECONDS:5}
app.sevendays.telnet.host=${SEVEN_DAYS_TELNET_HOST:${SEVENDAYS_TELNET_HOST:127.0.0.1}}
app.sevendays.telnet.port=${SEVEN_DAYS_TELNET_PORT:${SEVENDAYS_TELNET_PORT:8081}}
app.sevendays.telnet.password=${SEVEN_DAYS_TELNET_PASSWORD:${SEVEN_DAYS_TO_DIE_TELNET_PASSWORD:}}
app.sevendays.telnet.scheduled-enabled=${SEVEN_DAYS_TELNET_ENABLED:${SEVENDAYS_TELNET_ENABLED:${SEVENDAYS_TELNET_SCHEDULED_ENABLED:false}}}
app.sevendays.telnet.initial-delay-ms=${SEVEN_DAYS_TELNET_INITIAL_DELAY_MS:${SEVENDAYS_TELNET_INITIAL_DELAY_MS:30000}}
app.sevendays.telnet.lp-interval-seconds=${SEVEN_DAYS_TELNET_LP_INTERVAL_SECONDS:60}
app.sevendays.telnet.fixed-delay-ms=${SEVENDAYS_TELNET_FIXED_DELAY_MS:30000}
app.sevendays.telnet.read-timeout-ms=${SEVEN_DAYS_TELNET_READ_TIMEOUT_MS:${SEVENDAYS_TELNET_READ_TIMEOUT_MS:15000}}

# Beta manual AI comment editor. Set this in EC2 .env to protect comment publishing.
app.ai-comment.editor-key=${AI_COMMENT_EDITOR_KEY:}
app.sevendays.transaction.current-state-max-age-seconds=${SEVEN_DAYS_CURRENT_STATE_MAX_AGE_SECONDS:${SEVENDAYS_CURRENT_STATE_MAX_AGE_SECONDS:120}}
app.sevendays.poi.translation-resource=${SEVEN_DAYS_POI_TRANSLATION_RESOURCE:classpath:poi-translations.csv}
app.auth.bootstrap.login=${WATCHPOINT_BOOTSTRAP_LOGIN:}
app.auth.bootstrap.password=${WATCHPOINT_BOOTSTRAP_PASSWORD:}
app.ai-analysis.window-minutes=${WATCHPOINT_AI_ANALYSIS_WINDOW_MINUTES:30}
app.ai-analysis.max-events=${WATCHPOINT_AI_ANALYSIS_MAX_EVENTS:60}
app.ai-analysis.system-prompt-resource=${WATCHPOINT_AI_SYSTEM_PROMPT_RESOURCE:classpath:prompts/watchpoint-system-prompt.txt}
app.ai-analysis.bedrock-enabled=${WATCHPOINT_AI_BEDROCK_ENABLED:false}
app.ai-analysis.aws-region=${WATCHPOINT_AI_AWS_REGION:ap-northeast-1}
app.ai-analysis.model-id=${WATCHPOINT_AI_BEDROCK_MODEL_ID:jp.anthropic.claude-haiku-4-5-20251001-v1:0}
app.ai-analysis.max-output-tokens=${WATCHPOINT_AI_MAX_OUTPUT_TOKENS:240}
app.ai-analysis.schedule-minutes=${WATCHPOINT_AI_SCHEDULE_MINUTES:30}
app.ai-analysis.initial-delay-ms=${WATCHPOINT_AI_INITIAL_DELAY_MS:60000}
app.ai-analysis.max-posts-per-day=${WATCHPOINT_AI_MAX_POSTS_PER_DAY:10}
app.ai-analysis.diary-enabled=${WATCHPOINT_AI_DIARY_ENABLED:${WATCHPOINT_AI_BEDROCK_ENABLED:false}}
app.ai-analysis.diary-cron=${WATCHPOINT_AI_DIARY_CRON:0 15 20 * * *}
