<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Terrariaのワールドデータから作る統計・アイテム検索サイト">
  <title th:text="${container.label + ' | ' + game.displayName}">Luminite | Terraria</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/img/site-icon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" th:href="@{/css/app.css(v='header-6')}">
  <link rel="stylesheet" th:href="@{/css/luminite.css(v='4')}">
</head>
<body class="luminite-body">
<header th:replace="~{fragments/header :: appHeader('terraria', 'luminite-topbar')}"></header>
<main class="luminite-shell">
  <nav th:replace="~{fragments/luminite :: tabs}"></nav>
  <section class="luminite-panel" aria-labelledby="chest-title">
    <a class="luminite-back" th:href="@{/luminite/chests}">← 管理チェスト</a>
    <div class="section-heading">
      <div>
        <p class="eyebrow" th:text="${container.kind}">チェスト</p>
        <h1 id="chest-title" th:text="${container.label}">木のチェスト</h1>
        <p class="luminite-sub"><span th:replace="~{fragments/luminite :: place(${container.place})}"></span></p>
      </div>
      <span class="luminite-count" th:text="${container.filled + ' / ' + container.slots + '枠'}">0 / 40枠</span>
    </div>
    <div th:replace="~{fragments/luminite :: snapshot}"></div>
    <p th:if="${#lists.isEmpty(container.items)}" class="luminite-empty">空っぽです。</p>
    <div class="luminite-table-wrap" th:unless="${#lists.isEmpty(container.items)}">
      <table class="luminite-table">
        <thead><tr><th>枠</th><th>アイテム</th><th>個数</th></tr></thead>
        <tbody>
          <tr th:each="slot : ${container.items}">
            <td class="num" th:text="${slot.slot + 1}">1</td>
            <td><a th:href="@{/luminite/items/{id}(id=${slot.itemId})}" th:classappend="${'lm-' + slot.category.icon()}"><svg th:replace="~{fragments/luminite :: icon(${slot.category})}"></svg> <span th:text="${slot.name}">木材</span></a></td>
            <td class="num" th:text="${slot.stack}">99</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
