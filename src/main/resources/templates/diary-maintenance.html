<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DIARY MAINTENANCE | WATCHPOINT</title><link rel="stylesheet" th:href="@{/css/app.css(v='20260809-1')}"></head>
<body>
<header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">WP</span><span><b>WATCHPOINT</b><small>DAILY DIARY / BETA</small></span></a><a class="nav-button" th:href="@{/diaries}">公開日記を見る</a></header>
<main class="detail-shell"><nav th:replace="~{fragments/navigation :: rail('maintenance')}"></nav><section class="layout detail-page">
  <header class="page-title"><nav class="breadcrumbs"><a th:href="@{/}"><span aria-hidden="true">⌂</span> 冒険記録</a><span>›</span><b><span aria-hidden="true">▤</span> 日別冒険日記</b></nav><p class="eyebrow">MAINTENANCE / DAILY AI DIARY</p><h1>日別冒険日記メンテナンス</h1><p>日本時間の1日ごとに冒険ログを集約します。生成材料をコピーしてAIへ渡し、完成した日記を同じ日付へ登録してください。</p></header>
  <section class="diary-day-list">
    <article class="panel diary-day-card" th:each="day : ${days}">
      <header><span th:text="${day.registered ? 'REGISTERED' : 'DRAFT'}">DRAFT</span><time th:text="${day.date}">date</time></header>
      <h2 th:text="${day.gameDayLabel}">DAY --</h2>
      <dl><div><dt>PLAYERS</dt><dd th:text="${day.participantCount}">0</dd></div><div><dt>EVENTS</dt><dd th:text="${day.eventCount}">0</dd></div></dl>
      <footer><a th:href="@{/maintenance/diaries/{date}(date=${day.date})}">生成データを見る</a><a th:href="@{/maintenance/diaries/{date}/edit(date=${day.date})}" th:text="${day.registered ? '日記を修正' : '日記を登録'}">日記を登録</a></footer>
    </article>
    <p class="empty panel" th:if="${#lists.isEmpty(days)}">日記にできるイベントがまだありません。</p>
  </section>
</section></main></body></html>
