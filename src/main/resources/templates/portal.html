<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="仲間とゲームの活動記録を共有するRubincoポータル">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>Rubinco</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/img/site-icon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" th:href="@{/css/app.css(v='header-3')}">
  <link rel="stylesheet" th:href="@{/css/portal.css(v='9')}">
  <script defer th:src="@{/js/portal.js(v='9')}"></script>
</head>
<body class="portal-body">
<header th:replace="~{fragments/header :: appHeader('portal', 'portal-topbar')}"></header>

<div class="portal-layout">
<main class="portal-shell">
  <div class="form-notice success" th:if="${param.logout}">ログアウトしました。</div>
  <section th:if="${!loggedIn}" class="portal-welcome" aria-labelledby="portal-title">
    <h1 id="portal-title" class="visually-hidden">ポータル</h1>
    <p>ログインすると、みんなのタイムラインを見られます。</p>
    <a class="portal-login-button" href="/portal?login" data-open-login>ログイン</a>
  </section>
  <section th:if="${loggedIn}" class="portal-feed" id="timeline" aria-labelledby="shared-timeline-title">
    <h1 id="shared-timeline-title">タイムライン</h1>
    <p th:if="${timeline.empty}" th:text="${timelinePage == 0 ? '活動記録はまだありません。' : 'このページの記録はありません。'}"></p>
    <article class="portal-event" th:each="event : ${timeline.content}">
      <header>
        <img class="user-avatar event-avatar" th:src="${@portalProfileService.avatar(event.actorPlayerId, event.creatorSub, profileDirectory, currentViewer)}" alt="" loading="lazy">
        <div class="event-who">
          <b class="event-author" th:text="${@portalProfileService.authorName(event.actorPlayerId, event.creatorSub, event.actorName, profileDirectory, currentViewer)}"></b>
          <time th:datetime="${event.occurredAt}" th:text="${#temporals.format(event.occurredAt, 'yyyy/MM/dd HH:mm', 'Asia/Tokyo')}"></time>
        </div>
        <th:block th:each="game : ${sites}" th:if="${game.id == event.gameId}">
          <a class="event-game" th:href="${siteEntries[game.id]}" th:attr="aria-label=${game.displayName},title=${game.displayName}">
            <svg class="site-icon" viewBox="0 0 16 16" aria-hidden="true"><use th:href="@{/img/game-icons.svg(v='2')} + '#game-' + ${#lists.contains({'7dtd', 'terraria', 'corekeeper'}, game.id) ? game.id : 'generic'}"></use></svg></a>
        </th:block>
        <span th:each="game : ${servers}" th:if="${game.id == event.gameId and !siteEntries.containsKey(game.id)}"
              class="event-game" th:attr="aria-label=${game.name},title=${game.name}">
          <svg class="site-icon" viewBox="0 0 16 16" aria-hidden="true"><use th:href="@{/img/game-icons.svg(v='2')} + '#game-' + ${#lists.contains({'7dtd', 'terraria', 'corekeeper'}, game.id) ? game.id : 'generic'}"></use></svg></span>
      </header>
      <h3 th:text="${event.title}">活動記録</h3>
      <p class="portal-event-body" th:text="${event.body}"></p>
    </article>
    <nav class="portal-feed-pages" aria-label="共通タイムラインのページ">
      <a th:if="${timeline.hasPrevious()}" th:href="@{/portal(page=${timelinePage - 1})} + '#timeline'">← 新しい記録</a>
      <a th:if="${timeline.hasNext()}" th:href="@{/portal(page=${timelinePage + 1})} + '#timeline'">過去の記録 →</a>
    </nav>
  </section>
</main>
<aside class="portal-server-rail server-controls" id="servers" aria-labelledby="server-rail-title"
       th:attr="data-live-server-status=${liveServerStatus},data-memory-budget-mib=${memoryBudget.budgetMiB}">
  <h2 id="server-rail-title">サーバー</h2>
  <p th:if="${canStartServers}" class="server-memory-budget" role="status" aria-live="polite"
     th:attr="title=${liveServerStatus ? 'コンテナの稼働状況' : '保存されている稼働状況'}">
    メモリ <span data-memory-reserved th:text="${memoryBudget.reservedLabel()}">未確認</span>
    / <span th:text="${memoryBudget.budgetLabel()}"></span>
  </p>
  <article th:each="server : ${servers}" class="server-control"
           th:classappend="${'game-' + (siteAccents[server.id] ?: 'none')}"
           th:attr="data-server=${server.id},data-status=${server.status.code},data-memory-mib=${server.status.memory.requiredMiB}">
    <a class="server-game" th:href="${siteLinks.containsKey(server.id) ? siteLinks[server.id] : null}" th:attr="aria-label=${server.name},title=${server.name}">
      <svg class="site-icon" viewBox="0 0 16 16" aria-hidden="true"><use th:href="@{/img/game-icons.svg(v='2')} + '#game-' + ${#lists.contains({'7dtd', 'terraria', 'corekeeper'}, server.id) ? server.id : 'generic'}"></use></svg>
    </a>
    <div class="server-state">
      <span class="pixel-status" th:attr="data-server-status=${server.id}"
            th:classappend="${'status-' + server.status.code}" th:text="${server.status.label}"></span>
      <small class="server-online" th:if="${onlineCounts[server.id] != null and onlineCounts[server.id] > 0}"
             th:text="${onlineCounts[server.id] + '人が接続中'}">1人が接続中</small>
    </div>
    <div class="server-buttons" th:if="${canStartServers and server.manualStart}">
      <form method="post"
            th:action="@{/portal/actions/games/{id}/start(id=${server.id})}"
            th:attr="data-start-server=${server.id},data-status=${server.status.code},data-memory-allowed=${server.status.memory.startAllowed}">
        <button type="submit" class="server-start-button" th:disabled="${!server.status.memory.startAllowed}"
                th:attr="aria-label=${server.name + 'を起動'},title=${'起動（必要メモリ ' + server.status.memory.requiredLabel() + '）'}">起動</button>
      </form>
      <form method="post" class="server-stop-form"
            th:action="@{/portal/actions/games/{id}/stop(id=${server.id})}"
            th:attr="data-stop-server=${server.id},data-status=${server.status.code},data-server-name=${server.name}">
        <button type="submit" class="server-stop-button"
                th:disabled="${server.status.code != 'online' and server.status.code != 'starting'}"
                th:attr="aria-label=${server.name + 'を停止'},title='停止'">停止</button>
      </form>
    </div>
    <small th:if="${canStartServers and !server.manualStart}" class="server-auto-start">自動</small>
    <th:block th:if="${canStartServers}">
      <p class="server-memory-reason" data-memory-reason
         th:text="${server.manualStart and server.status.code == 'offline' ? server.status.memory.reason : ''}"></p>
      <p class="server-control-notice" role="alert" th:attr="data-control-notice=${server.id}"
         th:text="${server.status.notice}"></p>
      <p class="server-action-message" role="status" aria-live="polite"></p>
    </th:block>
  </article>
  <p th:if="${canStartServers}" class="server-memory-note">起動後、接続できるまで数分かかることがあります。停止は保存のため最大2分ほどかかります。</p>
</aside>
</div>
<th:block th:if="${!loggedIn}"><dialog th:replace="~{fragments/portal-login :: modal}"></dialog></th:block>
</body>
</html>
