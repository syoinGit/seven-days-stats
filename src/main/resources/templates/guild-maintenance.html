<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head>
<th:block th:replace="~{fragments/guild :: meta('ギルドメンテナンス')}"></th:block>
<link rel="icon" type="image/png" sizes="64x64" href="/img/site-icon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
</head><body class="portal-body guild-body">
<header th:replace="~{fragments/header :: appHeader('guild', 'portal-topbar')}"></header><main class="guild-shell"><a href="/guild">← 酒場</a><h1>ギルドメンテナンス</h1>
<section class="guild-panel"><h2>新しい住人を迎える</h2><p>日本時間の毎日21時に自動生成します。管理者はここからも追加できます。自動・手動を合わせて1日1人、生成の試行は1日3回までです。</p><p>確定済みの来店名簿は変わりません。後から生まれた住人は名簿に載り、翌日以降に来店します。</p><p th:unless="${enabled}">現在、生成は無効です。サーバーの GUILD_ENABLED=true で有効にしてください。</p><p class="guild-notice" th:if="${notice}" th:text="${notice}" role="status"></p>
<form method="post" th:action="@{/guild/maintenance/generate}"><button type="submit" th:disabled="${!enabled}">今日の住人を追加 / 再試行</button></form></section>
<section class="guild-panel"><h2>直近30日の実行履歴</h2><p th:if="${#lists.isEmpty(jobs)}">まだ生成の実行記録はありません。</p><ul class="guild-jobs"><li th:each="job : ${jobs}"><strong th:text="${job.date + ' / ' + job.status + ' / ' + job.attempts + '回'}"></strong><p th:text="${job.message}"></p></li></ul></section></main></body></html>
