<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Terrariaのワールドデータから作る統計・アイテム検索サイト">
  <title th:text="${'管理チェスト | ' + game.displayName}">Luminite | Terraria</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/img/site-icon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" th:href="@{/css/app.css(v='header-5')}">
  <link rel="stylesheet" th:href="@{/css/luminite.css(v='3')}">
</head>
<body class="luminite-body">
<header th:replace="~{fragments/header :: appHeader('terraria', 'luminite-topbar')}"></header>
<main class="luminite-shell">
  <nav th:replace="~{fragments/luminite :: tabs}"></nav>
  <section class="luminite-panel" aria-labelledby="chests-title">
    <div class="section-heading">
      <div><h1 id="chests-title">管理チェスト</h1></div>
      <span class="luminite-count" th:text="${containers.totalElements + '件'}">0件</span>
    </div>
    <div th:replace="~{fragments/luminite :: snapshot}"></div>
    <p th:replace="~{fragments/luminite :: namesMissing}"></p>
    <form class="luminite-search" method="get" th:action="@{/luminite/chests}" role="search">
      <label><span>入っているアイテム・チェスト名</span><input type="search" name="q" maxlength="60" th:value="${q}" placeholder="例: 鉄のインゴット"></label>
      <label><span>種類</span>
        <select name="kind">
          <option value="">すべて</option>
          <option th:each="option : ${kinds}" th:value="${option.value}" th:selected="${kind == option.value}"
                  th:text="${option.label + '（' + option.count + '）'}">チェスト</option>
        </select>
      </label>
      <button type="submit">検索</button>
    </form>
    <p class="luminite-note">住人の家かパイロンから50タイル（100ft）以内にある入れ物を「管理チェスト」として表示します。洞窟やダンジョンに最初からある宝箱は含みません。条件を指定しないときは、中身が入っている入れ物だけを表示します。場所は方位磁石・深度計と同じ表し方（1タイル = 2ft）です。</p>
    <p th:if="${containers.isEmpty()}" class="luminite-empty">当てはまる入れ物はありません。</p>
    <ul class="luminite-containers" th:unless="${containers.isEmpty()}">
      <li th:each="container : ${containers.content}">
        <div class="luminite-container-head">
          <a th:href="@{/luminite/chests/{id}(id=${container.id})}" th:text="${container.label}">木のチェスト</a>
          <small th:text="${container.filled + ' / ' + container.slots + '枠'}">12 / 40枠</small>
        </div>
        <span th:replace="~{fragments/luminite :: place(${container.place})}"></span>
        <ul class="luminite-slots" th:unless="${#lists.isEmpty(container.items)}">
          <li th:each="slot : ${container.items}" th:classappend="${slot.match} ? 'match'">
            <a th:href="@{/luminite/items/{id}(id=${slot.itemId})}" th:classappend="${'lm-' + slot.category.icon()}"><svg th:replace="~{fragments/luminite :: icon(${slot.category})}"></svg><span th:text="${slot.name}">木材</span><b th:text="${slot.stack}" th:if="${slot.stack > 1}">99</b></a>
          </li>
        </ul>
      </li>
    </ul>
    <nav class="portal-feed-pages" aria-label="管理チェストのページ">
      <a th:if="${containers.hasPrevious()}" th:href="@{/luminite/chests(q=${q},kind=${kind},page=${containers.number - 1})}">← 前へ</a>
      <span th:if="${containers.totalPages > 1}" th:text="${(containers.number + 1) + ' / ' + containers.totalPages}"></span>
      <a th:if="${containers.hasNext()}" th:href="@{/luminite/chests(q=${q},kind=${kind},page=${containers.number + 1})}">次へ →</a>
    </nav>
  </section>
</main>
</body>
</html>
