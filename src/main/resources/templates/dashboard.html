<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/png" sizes="64x64" th:href="@{/img/watchpoint-icon-64.png}"><link rel="apple-touch-icon" th:href="@{/img/watchpoint-icon.png}">
  <title>タイムライン | Watchpoint</title>
  <link rel="stylesheet" th:href="@{/css/app.css(v='header-6')}"><link rel="stylesheet" th:href="@{/css/watchpoint.css(v='3')}">
  <script defer th:src="@{/js/timeline.js(v='20260909-1')}"></script>
</head>
<body class="watchpoint-body">
<header th:replace="~{fragments/header :: appHeader('7dtd', 'watchpoint-topbar')}"></header>

<main class="app-shell">
  <nav th:replace="~{fragments/navigation :: rail('timeline')}"></nav>

  <section class="feed-column">
    <header class="feed-header">
      <h1>タイムライン</h1>
      <button class="feed-refresh" type="button" data-refresh-page>
        <span aria-hidden="true">↻</span> 更新
      </button>
    </header>

    <div class="timeline-notices">
      <div class="form-notice success" th:if="${notice}" th:text="${notice}"></div>
      <div class="form-notice error" th:if="${error}" th:text="${error}"></div>
    </div>

    <article class="timeline-compose" th:if="${loggedIn and currentPlayerId != null}">
      <form method="post" th:action="@{/posts}">
        <label>
          <img class="feed-avatar" th:src="${currentAvatar}" alt="">
          <textarea name="body" rows="2" maxlength="100" placeholder="いま何してる？ 今日の冒険をつぶやく…" required></textarea>
        </label>
        <div class="timeline-compose-actions"><small>100文字以内</small><button type="submit">つぶやく</button></div>
      </form>
    </article>
    <aside class="timeline-login-prompt" th:if="${!loggedIn}">
      <span>つぶやき・いいねは冒険者ログイン後に利用できます。</span>
      <a th:href="@{/login}">ログイン</a>
    </aside>

    <ol class="feed" id="timeline" th:attr="data-timeline-url=@{/dashboard/timeline}">
      <li th:if="${#lists.isEmpty(timelinePage.items)}" class="empty">まだ冒険記録がありません。</li>
      <th:block th:replace="~{fragments/timeline :: page}"></th:block>
    </ol>
    <button type="button" class="timeline-loader" data-timeline-loader th:hidden="${!timelinePage.hasMore}"
         th:attr="data-next-offset=${timelinePage.nextOffset}"><span class="live-pulse"></span><b>過去の観測を読み込む</b><small data-timeline-progress aria-live="polite"></small></button>
  </section>

  <aside class="status-sidebar">
    <!-- World day and the blood moon countdown only mean something while the server runs. -->
    <section class="side-module blood-alert" th:if="${!serverStopped}"
             th:classappend="${' blood-alert-' + dashboard.bloodMoon.alertLevel}">
      <div class="module-head">
        <h2>血月</h2>
        <span class="world-day" th:if="${dashboard.worldTime.day != null}" th:text="${dashboard.worldTime.day + '日目 ' + dashboard.worldTime.time}">7日目 21:00</span>
      </div>
      <strong th:text="${dashboard.bloodMoon.detailText}">予定情報なし</strong>
      <b class="blood-countdown" th:text="${dashboard.bloodMoon.countdownText}">血月情報を待機中</b>
      <small th:if="${!#strings.isEmpty(dashboard.bloodMoon.occurredAt)}" th:text="${'前回 ' + dashboard.bloodMoon.occurredAt}">前回</small>
    </section>
    <section class="side-module world-stopped" th:if="${serverStopped}">
      <div class="module-head"><h2>ワールド</h2><span class="pixel-status status-offline">サーバー停止中</span></div>
    </section>

    <section class="side-module">
      <div class="module-head">
        <h2>プレイヤー</h2>
        <span class="pixel-status" th:with="online=${serverStopped ? 0 : (dashboard.serverState.playerCount ?: 0)}"
              th:classappend="${online > 0} ? 'status-online' : 'status-offline'"
              th:text="${online + '人がオンライン'}">0人がオンライン</span>
      </div>
      <div class="pilot-list live-party">
        <a class="pilot" th:if="${!currentViewer}" th:each="player : ${dashboard.playerStatuses}"
           th:href="@{/players/{id}(id=${player.playerId})}">
          <img class="user-avatar" th:src="${@portalProfileService.avatar(player.playerId, null, profileDirectory, currentViewer)}" alt="" loading="lazy">
          <span class="pilot-info">
            <strong th:text="${player.playerName}">player</strong>
            <small th:text="${player.statusSummary}">探索中</small>
            <small class="pilot-vitals" th:if="${player.online}">
              <span th:text="${player.health != null ? 'HP ' + player.health : 'HP --'}">HP --</span>
              <span th:if="${player.currentVehicle != null}" th:text="${' / ' + player.currentVehicle + 'で移動中'}">vehicle</span>
            </small>
          </span>
          <b th:text="${player.level != null ? 'Lv.' + player.level : ''}">Lv.</b>
        </a>
        <div class="pilot" th:if="${currentViewer}" th:each="player : ${dashboard.playerStatuses}">
          <img class="user-avatar" th:src="${@portalProfileService.avatar(player.playerId, null, profileDirectory, currentViewer)}" alt="" loading="lazy">
          <span class="pilot-info"><strong th:text="${player.playerName}">player</strong><small th:text="${player.statusSummary}">探索中</small><small class="pilot-vitals" th:if="${player.online}"><span th:text="${player.health != null ? 'HP ' + player.health : 'HP --'}">HP --</span></small></span>
          <b th:text="${player.level != null ? 'Lv.' + player.level : ''}">Lv.</b>
        </div>
        <p th:if="${#lists.isEmpty(dashboard.playerStatuses)}" class="empty">まだ記録がありません。</p>
      </div>
    </section>

    <a class="side-module server-summary" th:href="@{/server}">
      <div class="module-head"><h2>サーバー</h2></div>
      <div><span>FPS</span><b th:text="${dashboard.serverState.fps ?: '-'}">-</b></div>
      <div><span>最終受信</span><b th:text="${dashboard.serverState.occurredAt ?: '-'}">-</b></div>
      <small>サーバー情報 →</small>
    </a>
  </aside>
</main>
</body>
</html>
