<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Core Keeperのワールドデータから作る統計・アイテム検索サイト">
  <title th:text="${'入れ物 | ' + game.displayName}">Octarine | Core Keeper</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/img/site-icon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" th:href="@{/css/app.css(v='header-6')}">
  <link rel="stylesheet" th:href="@{/css/octarine.css(v='8')}">
</head>
<body class="octarine-body">
<header th:replace="~{fragments/header :: appHeader('corekeeper', 'octarine-topbar')}"></header>
<main class="octarine-shell">
  <nav th:replace="~{fragments/octarine :: tabs}"></nav>
  <section class="octarine-panel" aria-labelledby="chest-title">
    <a class="octarine-back" th:href="@{/octarine/chests}">← チェスト検索</a>
    <div class="section-heading">
      <div>
        <p class="eyebrow" th:text="${container.kind}">Wood Chest</p>
        <h1 id="chest-title" th:text="${container.name}">鉱石倉庫</h1>
        <p class="octarine-sub"><span th:replace="~{fragments/octarine :: place(${container.place})}"></span></p>
      </div>
      <span class="octarine-count" th:text="${container.filled + ' / ' + container.slots + '枠'}">3 / 18枠</span>
    </div>
    <div th:replace="~{fragments/octarine :: snapshot}"></div>
    <p th:if="${#lists.isEmpty(container.items)}" class="octarine-empty">空っぽです。</p>
    <ol class="ck-grid" aria-label="チェストの枠">
      <li th:each="cell : ${container.cells()}" th:classappend="${cell.item == null} ? 'empty' : ${'ck-' + cell.item.category.icon()}">
        <a th:if="${cell.item != null}" th:href="@{/octarine/items/{id}(id=${cell.item.objectId})}"
           th:title="${cell.item.name + '（' + cell.item.category.label() + '）' + (cell.item.amountLabel().isEmpty() ? '' : ' ' + cell.item.amountLabel())}">
          <svg th:replace="~{fragments/octarine :: icon(${cell.item.category})}"></svg>
          <span class="ck-name" th:text="${cell.item.name}">木材</span>
          <b class="ck-amount" th:unless="${cell.item.amountLabel().isEmpty()}" th:text="${cell.item.amountLabel()}">×30</b>
        </a>
      </li>
    </ol>
    <ul th:replace="~{fragments/octarine :: legend}"></ul>
    <p th:replace="~{fragments/octarine :: amountNote}"></p>

    <h2 class="octarine-group-title">中身の変化</h2>
    <p th:if="${#lists.isEmpty(changes)}" class="octarine-empty">ラベルを付けてから、まだ変化はありません。</p>
    <ol class="octarine-changes" th:unless="${#lists.isEmpty(changes)}">
      <li th:each="change : ${changes}" th:classappend="${change.up() ? 'up' : 'down'}">
        <time th:text="${change.at}">---</time>
        <span><a th:href="@{/octarine/items/{id}(id=${change.objectId})}" th:text="${change.item}">Wood</a>
          <span th:text="${change.label()}">3 → 5</span></span>
        <b th:text="${change.deltaLabel()}">+2</b>
      </li>
    </ol>
    <p class="octarine-note">取り込みの間隔（10分）ごとの差し引きです。</p>
  </section>
</main>
</body>
</html>
