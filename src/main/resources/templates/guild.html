<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:replace="~{fragments/guild :: meta(${windowTitle != null ? windowTitle : '無人の冒険者ギルド'})}"></th:block>
<link rel="icon" type="image/png" sizes="64x64" href="/img/site-icon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
</head>
<!-- The tavern is the one screen; every other page of the guild is a window drawn over it (fragments/guild-windows.html). -->
<body class="portal-body guild-body" th:classappend="${window != null} ? 'guild-window-open'">
<header th:replace="~{fragments/header :: appHeader('guild', 'portal-topbar')}"></header>
<main class="guild-stage">
  <div class="guild-hud">
    <h1 class="guild-plate"><small>THE UNATTENDED GUILD</small>無人の冒険者ギルド</h1>
    <p class="guild-clock" th:text="${#temporals.format(room.date, 'M月d日') + ' · ' + (room.phase == 'morning' ? '朝' : (room.phase == 'afternoon' ? '昼' : '夜'))}">10月25日 · 夜</p>
  </div>
  <!-- The tavern is five places seen one at a time from inside (GuildTavern says who is where); the map picks the place.
       Or tonight's dungeon. The radios drive the CSS, so it works without JS. -->
  <input th:each="area : ${tavern.areas}" class="area-radio" type="radio" name="guild-view" th:id="${'guild-area-' + area.key}"
         th:checked="${area.key == tavern.current}" th:attr="aria-label=${area.name}">
  <input class="area-radio" type="radio" name="guild-view" id="guild-view-dungeon" aria-label="ダンジョン">
  <div class="guild-controls">
    <label class="guild-back" th:for="${'guild-area-' + tavern.current}">酒場に戻る</label>
    <label class="guild-dungeon-button" for="guild-view-dungeon"><svg viewBox="0 0 16 16" aria-hidden="true"><use href="/img/guild-icons.svg?v=3#tab-dungeon"></use></svg>ダンジョン<span th:if="${todayRun != null and !todayRun.back()}" class="pop-live">探索中</span></label>
  </div>
  <section class="guild-room" th:classappend="${room.phase}" aria-label="ギルド兼酒場。見取り図で場所を選べます。人物を選ぶと紹介を読めます。">
    <div th:each="area : ${tavern.areas}" class="tv-area" th:classappend="${'tv-' + area.key}">
      <div class="tv-back" aria-hidden="true">
        <th:block th:if="${area.key == 'counter'}"><span class="tv-window"></span><span class="tv-beam"></span><span class="tv-shelf"></span><span class="tv-lamp one"></span><span class="tv-lamp two"></span></th:block>
        <th:block th:if="${area.key == 'tables'}"><span class="tv-window"></span><span class="tv-window second"></span><span class="tv-beam"></span><span class="tv-lamp one"></span><span class="tv-lamp two"></span><span class="tv-walker"><i></i></span></th:block>
        <th:block th:if="${area.key == 'board'}"><span class="tv-candle"></span><span class="tv-candle right"></span></th:block>
        <th:block th:if="${area.key == 'party'}"><span class="tv-chart"></span><span class="tv-shield"></span><span class="tv-sconce"></span><span class="tv-sconce right"></span></th:block>
        <th:block th:if="${area.key == 'hearth'}"><span class="tv-glow"></span><span class="tv-fireplace"><span class="tv-fire"><i></i><i></i><i></i></span><span class="tv-spark"></span><span class="tv-spark two"></span><span class="tv-spark three"></span></span><span class="tv-rug"></span><span class="tv-sleeper"><i></i></span><span class="tv-zz"></span></th:block>
      </div>
      <a th:if="${area.key == 'board'}" class="tv-cork" href="/guild/board" aria-label="依頼掲示板を開く"><i></i><i></i><i></i><i></i><i></i><i></i></a>
      <a th:each="seat : ${area.seats}" class="room-person"
         th:with="visit=${seat.visit}, said=${scene != null ? scene.lines.get(seat.visit.character.id) : null}, talking=${scene != null and scene.lines.containsKey(seat.visit.character.id)},
                  line=${idleLines.get(seat.visit.character.id) != null ? idleLines.get(seat.visit.character.id) : seat.visit.line},
                  turns=${talking ? scene.turnsOf(seat.visit.character.id) : null}"
         th:classappend="${'slot-' + seat.slot + ' ' + visit.character.appearance + (talking ? ' talking' : '')}"
         th:href="@{/guild/characters/{id}(id=${visit.character.id})}" th:attr="aria-label=${visit.character.name + '：' + (said != null ? said : line)}">
        <span class="person-bubble"><th:block th:if="${turns == null or turns.isEmpty()}" th:text="${said != null ? said : line}"></th:block><span
          th:each="turn : ${turns}" class="say" th:attr="data-turn=${turn.index}" th:text="${turn.text}"></span></span>
        <svg th:replace="~{fragments/guild :: sprite(${visit.character})}"></svg>
        <span class="person-name" th:text="${visit.character.name}"></span>
      </a>
      <div class="tv-front" aria-hidden="true">
        <th:block th:if="${area.key == 'counter' or area.key == 'tables' or area.key == 'party'}"><span th:each="seat : ${area.seats}" class="tv-mug" th:classappend="${'slot-' + seat.slot}"></span></th:block>
        <th:block th:if="${area.key == 'counter'}"><span class="tv-bar"></span><span class="tv-cat"><i></i></span></th:block>
        <th:block th:if="${area.key == 'tables'}"><span class="tv-table"></span><span class="tv-table second"></span></th:block>
        <th:block th:if="${area.key == 'hearth'}"><span class="tv-sofa"></span></th:block>
        <th:block th:if="${area.key == 'party'}"><span class="tv-round"></span><span class="tv-loot" th:if="${area.count() > 0 and todayRun != null and todayRun.back() and todayRun.result != 'retreat'}"><i></i></span></th:block>
      </div>
      <p class="tv-title"><b th:text="${area.name}">カウンター</b><th:block th:text="${area.count() > 0 ? area.count() + '人' : (area.key == 'party' ? 'ダンジョンから戻った仲間が座る' : '誰もいない')}">3人</th:block></p>
    </div>
    <div class="tv-light" aria-hidden="true"></div>
    <div class="tv-map" role="group" aria-label="酒場の見取り図">
      <label th:each="area : ${tavern.areas}" class="tv-zone" th:for="${'guild-area-' + area.key}" th:classappend="${'z-' + area.key + (area.talk ? ' talk' : '')}"
             th:title="${area.talk ? area.name + '（会話中）' : area.name}">
        <b th:text="${area.name}">カウンター</b><span class="tv-dots"><i th:each="seat : ${area.seats}"></i></span>
      </label>
    </div>
    <div class="room-empty" th:if="${#lists.isEmpty(room.visits)}"><strong>暖炉に火が入りました。</strong><p>まだ静かな酒場です。<br>最初の住人が訪れる日を待っています。</p></div>
  </section>
  <!-- Tonight's dungeon run, as if watched from inside: the dungeon, the party walking, what they are doing, the latest stage. -->
  <section class="guild-dungeon-scene" th:classappend="${todayRun != null ? 'dg-' + todayRun.dungeonKey + (todayRun.inDanger() ? ' danger' : '') + (todayRun.back() ? ' back' : '') : 'dg-idle'}"
           aria-label="ダンジョンの様子">
    <div class="dg-wall" aria-hidden="true"></div><div class="dg-deco" aria-hidden="true"></div><div class="dg-floor" aria-hidden="true"></div>
    <span class="dg-torch one" aria-hidden="true"></span><span class="dg-torch two" aria-hidden="true"></span>
    <div class="dg-foe" aria-hidden="true"><i></i></div><div class="dg-mist" aria-hidden="true"></div>
    <th:block th:if="${todayRun == null}">
      <div class="dg-status"><strong>今夜の探索はまだです</strong><small>毎晩21:50に、酒場から1〜4人がダンジョンへ出発します。</small></div>
    </th:block>
    <th:block th:if="${todayRun != null}">
      <div class="dg-status"><strong th:text="${todayRun.status()}">古い坑道で戦闘中</strong>
        <span class="pop-progress"><span th:each="stage : ${todayRun.stages}" th:classappend="${stage.revealed() ? 'done' : ''}" th:text="${stage.name}">起</span></span></div>
      <div class="dg-party" th:unless="${todayRun.back()}">
        <a th:each="member : ${runMembers}" class="dg-member" th:href="@{/guild/characters/{id}(id=${member.id})}">
          <svg th:replace="~{fragments/guild :: sprite(${member})}"></svg><span class="person-name" th:text="${member.name}">リネ</span></a>
      </div>
      <div class="dg-story">
        <p th:if="${todayRun.latest() != null}"><b th:text="${todayRun.latest().name}">承</b><th:block th:text="${todayRun.latest().body}">湿った岩の隙間に薬草が生えていた。</th:block></p>
        <p th:if="${todayRun.latest() == null}" th:text="${todayRun.party() + 'は' + todayRun.goal() + '。'}">リネとロアンは古い坑道で失われたランタンを探しに行く。</p>
        <small><th:block th:if="${todayRun.next() != null}" th:text="${'次の知らせは ' + #temporals.format(todayRun.next().revealAt.atZoneSameInstant(T(com.yuki.rubinco.guild.GuildService).TOKYO), 'H:mm') + 'ごろ ・ '}">次の知らせは 22:20ごろ ・ </th:block><a href="/guild/dungeon">探索の記録を読む →</a></small>
      </div>
    </th:block>
  </section>
  <p class="guild-caption" th:if="${scene == null}">人物を選ぶと、その人の物語が開きます。</p>
  <p class="guild-caption guild-now" th:if="${scene != null}">いまの酒場：<a th:href="@{/guild/log/{id}(id=${scene.interactionId})}" th:text="${scene.summary}">リネとロアンは天気の話をした</a></p>
</main>
<div class="guild-scrim" data-guild-scrim th:hidden="${window == null}"></div>
<dialog id="guild-window" class="guild-window" th:open="${window != null}" aria-labelledby="guild-window-title">
  <th:block th:if="${window != null}">
    <div class="guild-window-bar"><h2 id="guild-window-title" th:text="${windowTitle}">住人名簿</h2><a class="guild-window-close" href="/guild" data-guild-close aria-label="閉じて酒場に戻る">×</a></div>
    <div class="guild-window-body"><th:block th:replace="~{fragments/guild-windows :: __${window}__}"></th:block></div>
  </th:block>
</dialog>
<nav th:replace="~{fragments/guild :: tabbar(${tab})}"></nav>
<script defer src="/js/guild.js?v=4"></script>
</body></html>
