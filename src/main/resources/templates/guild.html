<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:replace="~{fragments/guild :: meta(${windowTitle != null ? windowTitle : '無人の冒険者ギルド'})}"></th:block>
<link rel="icon" type="image/png" sizes="64x64" href="/img/site-icon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
</head>
<!-- The tavern is the one screen; every other page of the guild is a window drawn over it (fragments/guild-windows.html). -->
<body class="portal-body guild-body" th:classappend="${window != null} ? 'guild-window-open'">
<header th:replace="~{fragments/header :: appHeader('guild', 'portal-topbar')}"></header>
<main class="guild-stage">
  <div class="guild-hud">
    <h1 class="guild-plate"><small>THE UNATTENDED GUILD</small>無人の冒険者ギルド</h1>
    <p class="guild-clock" th:text="${#temporals.format(room.date, 'M月d日') + ' · ' + (room.phase == 'morning' ? '朝' : (room.phase == 'afternoon' ? '昼' : '夜'))}">10月25日 · 夜</p>
  </div>
  <!-- One floor at a time, or tonight's dungeon (the radios drive the CSS): downstairs six seats (0-5), upstairs four (6-9). Talk is drawn among all ten. Works without JS. -->
  <input class="floor-radio" type="radio" name="guild-floor" id="guild-floor-1" checked>
  <input class="floor-radio" type="radio" name="guild-floor" id="guild-floor-2">
  <input class="floor-radio" type="radio" name="guild-floor" id="guild-view-dungeon">
  <div class="guild-controls">
    <div class="guild-floors" role="group" aria-label="階の切り替え">
      <label for="guild-floor-1" th:classappend="${floors.talkDown ? 'talk' : ''}" th:text="${'1F（' + floors.downstairs + '人）'}">1F（6人）</label>
      <label for="guild-floor-2" th:classappend="${floors.talkUp ? 'talk' : ''}" th:text="${'2F（' + floors.upstairs + '人）'}">2F（4人）</label>
    </div>
    <label class="guild-dungeon-button" for="guild-view-dungeon"><svg viewBox="0 0 16 16" aria-hidden="true"><use href="/img/guild-icons.svg?v=3#tab-dungeon"></use></svg>ダンジョン<span th:if="${todayRun != null and !todayRun.back()}" class="pop-live">探索中</span></label>
  </div>
  <section class="guild-room" th:classappend="${room.phase}" aria-label="ギルド兼酒場の一室。人物を選ぶと紹介を読めます。">
    <div class="room-inner">
    <div class="room-upper" aria-hidden="true"><div class="room-wall"><div class="room-window"></div><div class="room-sign">THE GUILD</div><div class="room-window second"></div></div></div>
    <div class="room-table table-three" aria-hidden="true"></div><div class="room-table table-four" aria-hidden="true"></div>
    <div class="room-rail" aria-hidden="true"></div><div class="room-beam" aria-hidden="true"></div>
    <div class="room-lower" aria-hidden="true"><div class="room-wall"><span class="room-lamp one"></span><span class="room-lamp two"></span></div></div>
    <div class="room-stairs" aria-hidden="true"></div>
    <div class="room-counter" aria-hidden="true"><i></i></div>
    <div class="room-fireplace" aria-hidden="true"><div class="fire"></div></div>
    <div class="room-table table-one" aria-hidden="true"></div><div class="room-table table-two" aria-hidden="true"></div>
    <div class="room-rug" aria-hidden="true"></div>
    <a th:each="visit : ${room.visits}" class="room-person"
       th:with="said=${scene != null ? scene.lines.get(visit.character.id) : null}, talking=${scene != null and scene.lines.containsKey(visit.character.id)}"
       th:classappend="${'seat-' + visit.seat + ' ' + (visit.seat >= 6 ? 'upstairs ' : 'downstairs ') + visit.character.appearance + (talking ? ' talking' : '')}"
       th:href="@{/guild/characters/{id}(id=${visit.character.id})}" th:attr="aria-label=${visit.character.name + '：' + (said != null ? said : visit.line)}">
      <span class="person-bubble" th:text="${said != null ? said : visit.line}"></span>
      <svg th:replace="~{fragments/guild :: sprite(${visit.character})}"></svg>
      <span class="person-name" th:text="${visit.character.name}"></span>
    </a>
    </div>
    <div class="room-empty" th:if="${#lists.isEmpty(room.visits)}"><strong>暖炉に火が入りました。</strong><p>まだ静かな酒場です。<br>最初の住人が訪れる日を待っています。</p></div>
  </section>
  <!-- Tonight's dungeon run, as if watched from inside: the dungeon, the party walking, what they are doing, the latest stage. -->
  <section class="guild-dungeon-scene" th:classappend="${todayRun != null ? 'dg-' + todayRun.dungeonKey + (todayRun.inDanger() ? ' danger' : '') + (todayRun.back() ? ' back' : '') : 'dg-idle'}"
           aria-label="ダンジョンの様子">
    <div class="dg-wall" aria-hidden="true"></div><div class="dg-deco" aria-hidden="true"></div><div class="dg-floor" aria-hidden="true"></div>
    <span class="dg-torch one" aria-hidden="true"></span><span class="dg-torch two" aria-hidden="true"></span>
    <div class="dg-foe" aria-hidden="true"><i></i></div><div class="dg-mist" aria-hidden="true"></div>
    <th:block th:if="${todayRun == null}">
      <div class="dg-status"><strong>今夜の探索はまだです</strong><small>毎晩21:50に、酒場から1〜4人がダンジョンへ出発します。</small></div>
    </th:block>
    <th:block th:if="${todayRun != null}">
      <div class="dg-status"><strong th:text="${todayRun.status()}">古い坑道で戦闘中</strong>
        <span class="pop-progress"><span th:each="stage : ${todayRun.stages}" th:classappend="${stage.revealed() ? 'done' : ''}" th:text="${stage.name}">起</span></span></div>
      <div class="dg-party" th:unless="${todayRun.back()}">
        <a th:each="member : ${runMembers}" class="dg-member" th:href="@{/guild/characters/{id}(id=${member.id})}">
          <svg th:replace="~{fragments/guild :: sprite(${member})}"></svg><span class="person-name" th:text="${member.name}">リネ</span></a>
      </div>
      <div class="dg-story">
        <p th:if="${todayRun.latest() != null}"><b th:text="${todayRun.latest().name}">承</b><th:block th:text="${todayRun.latest().body}">湿った岩の隙間に薬草が生えていた。</th:block></p>
        <p th:if="${todayRun.latest() == null}" th:text="${todayRun.party() + 'は' + todayRun.goal() + '。'}">リネとロアンは古い坑道で失われたランタンを探しに行く。</p>
        <small><th:block th:if="${todayRun.next() != null}" th:text="${'次の知らせは ' + #temporals.format(todayRun.next().revealAt.atZoneSameInstant(T(com.yuki.rubinco.guild.GuildService).TOKYO), 'H:mm') + 'ごろ ・ '}">次の知らせは 22:20ごろ ・ </th:block><a href="/guild/dungeon">探索の記録を読む →</a></small>
      </div>
    </th:block>
  </section>
  <p class="guild-caption" th:if="${scene == null}">人物を選ぶと、その人の物語が開きます。</p>
  <p class="guild-caption guild-now" th:if="${scene != null}">いまの酒場：<a th:href="@{/guild/log/{id}(id=${scene.interactionId})}" th:text="${scene.summary}">リネとロアンは天気の話をした</a></p>
</main>
<div class="guild-scrim" data-guild-scrim th:hidden="${window == null}"></div>
<dialog id="guild-window" class="guild-window" th:open="${window != null}" aria-labelledby="guild-window-title">
  <th:block th:if="${window != null}">
    <div class="guild-window-bar"><h2 id="guild-window-title" th:text="${windowTitle}">住人名簿</h2><a class="guild-window-close" href="/guild" data-guild-close aria-label="閉じて酒場に戻る">×</a></div>
    <div class="guild-window-body"><th:block th:replace="~{fragments/guild-windows :: __${window}__}"></th:block></div>
  </th:block>
</dialog>
<nav th:replace="~{fragments/guild :: tabbar(${tab})}"></nav>
<script defer src="/js/guild.js?v=3"></script>
</body></html>
