<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Terrariaのワールドデータから作る統計・アイテム検索サイト">
  <title th:text="${game.displayName + ' | Terraria'}">Luminite | Terraria</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/img/site-icon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" th:href="@{/css/app.css(v='header-4')}">
  <link rel="stylesheet" th:href="@{/css/luminite.css(v='2')}">
</head>
<body class="luminite-body">
<header th:replace="~{fragments/header :: appHeader('terraria', 'luminite-topbar')}"></header>
<main class="luminite-shell">
  <nav th:replace="~{fragments/luminite :: tabs}"></nav>
  <section class="luminite-panel" aria-label="準備中">
    <p class="luminite-empty">ワールドデータの統計は準備中です。取り込みが済むと、ここに表示されます。</p>
  </section>
</main>
</body>
</html>
