<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Core Keeperのワールドデータから作る統計・アイテム検索サイト">
  <title th:text="${'ワールド | ' + game.displayName}">Octarine | Core Keeper</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/img/site-icon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" th:href="@{/css/app.css(v='profile-1')}">
  <link rel="stylesheet" th:href="@{/css/octarine.css(v='2')}">
</head>
<body class="octarine-body">
<header th:replace="~{fragments/navigation :: siteHeader(@{/octarine}, ${game.displayName}, '◆', 'CORE KEEPER EXPEDITION LOG', 'octarine-topbar')}"></header>
<main class="octarine-shell">
  <nav th:replace="~{fragments/octarine :: tabs}"></nav>
  <section class="octarine-panel" aria-labelledby="world-title">
    <div class="section-heading">
      <div><p class="eyebrow">WORLD</p><h1 id="world-title">ワールドにある物</h1></div>
    </div>
    <div th:replace="~{fragments/octarine :: snapshot}"></div>
    <p th:replace="~{fragments/octarine :: namesMissing}"></p>
    <ul class="octarine-stats">
      <li><span>記録された物</span><strong th:text="${#numbers.formatInteger(summary.entities, 1, 'COMMA')}">0</strong><small>設置物・生き物・落とし物など</small></li>
      <li><span>生き物</span><strong th:text="${#numbers.formatInteger(summary.creatures, 1, 'COMMA')}">0</strong><small>保存時点の敵や動物</small></li>
      <li><span>作物</span><strong th:text="${#numbers.formatInteger(summary.crops, 1, 'COMMA')}">0</strong><small>育っている植物</small></li>
      <li th:if="${summary.skippedEntities > 0}"><span>読めなかった物</span><strong th:text="${summary.skippedEntities}">0</strong><small>形式を確認できていない種類のため数えていません</small></li>
    </ul>
    <p class="octarine-note">
      ゲームが保存している物だけで、地形のブロックや床は含みません。分類はデータの持ち方から決めた目安です。
      ボスは進捗に関わるため、この一覧には出しません。
    </p>

    <h2 class="octarine-group-title">作物</h2>
    <p th:if="${#lists.isEmpty(crops)}" class="octarine-empty">作物はありません。</p>
    <div class="octarine-table-wrap" th:unless="${#lists.isEmpty(crops)}">
      <table class="octarine-table">
        <thead><tr><th>植物</th><th>数</th><th>成長段階ごとの数</th></tr></thead>
        <tbody>
          <tr th:each="crop : ${crops}">
            <td th:text="${crop.name}">Heart Berry Plant</td>
            <td class="num" th:text="${crop.total}">3</td>
            <td><span th:each="stage, it : ${crop.stages}" th:text="${'段階' + stage.key + ': ' + stage.value + (it.last ? '' : '、')}">段階2: 3</span></td>
          </tr>
        </tbody>
      </table>
    </div>

    <th:block th:each="entry : ${counts}">
      <th:block th:unless="${#lists.isEmpty(entry.value)}">
        <h2 class="octarine-group-title" th:text="${entry.key}">生き物</h2>
        <ul class="octarine-resources">
          <li th:each="row : ${entry.value}"><span th:text="${row.name}">Slime</span><b th:text="${#numbers.formatInteger(row.count, 1, 'COMMA')}">12</b></li>
        </ul>
      </th:block>
    </th:block>
  </section>
</main>
</body>
</html>
