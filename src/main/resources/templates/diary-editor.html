<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DIARY EDITOR | WATCHPOINT</title><link rel="stylesheet" th:href="@{/css/app.css(v='20260809-4')}"></head>
<body>
<header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">WP</span><span><b>WATCHPOINT</b><small>DIARY REGISTRATION</small></span></a><a class="nav-button" th:href="@{/maintenance/diaries/{date}(date=${packet.date})}">生成データへ戻る</a></header>
<main class="detail-shell"><nav th:replace="~{fragments/navigation :: rail('maintenance')}"></nav><section class="layout detail-page">
  <header class="page-title"><nav class="breadcrumbs"><a th:href="@{/maintenance/diaries}"><span aria-hidden="true">▤</span> 日別冒険日記</a><span>›</span><b th:text="${packet.date}">date</b></nav><p class="eyebrow">MANUAL REGISTRATION / BETA</p><h1>生成した日記を登録</h1><p th:text="${packet.date + ' / ' + packet.gameDayLabel}">date</p></header>
  <p class="form-notice error" th:if="${error}" th:text="${error}">error</p>
  <article class="panel ai-editor-panel">
    <div class="panel-head"><h2>冒険日記</h2><small>ONE ENTRY PER DAY</small></div>
    <form class="ai-comment-form" method="post" th:action="@{/maintenance/diaries/{date}/edit(date=${packet.date})}" th:if="${editorEnabled}">
      <label><span>日記タイトル</span><input name="title" maxlength="120" required th:value="${draftTitle ?: (packet.diary != null ? packet.diary.title : packet.date + ' の冒険記録')}"></label>
      <label><span>日記本文</span><textarea name="body" maxlength="4000" required rows="16" th:text="${draftBody ?: (packet.diary != null ? packet.diary.body : '')}" placeholder="AIが生成した日記を貼り付けてください。"></textarea></label>
      <label><span>編集キー</span><input name="editorKey" type="password" required autocomplete="current-password"></label>
      <div class="form-actions"><small>同じ日付へ再登録すると内容を更新します。</small><button type="submit" th:text="${packet.diary != null ? '日記を更新' : '日記を登録'}">日記を登録</button></div>
    </form>
    <p class="editor-disabled" th:unless="${editorEnabled}">登録機能は停止中です。EC2の環境変数に <code>AI_COMMENT_EDITOR_KEY</code> を設定してください。</p>
  </article>
</section></main></body></html>
