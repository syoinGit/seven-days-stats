<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>冒険日記 | WATCHPOINT</title><link rel="stylesheet" th:href="@{/css/app.css(v='20260809-4')}"></head>
<body>
<header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">WP</span><span><b>WATCHPOINT</b><small>WASTELAND FIELD JOURNAL</small></span></a><a class="nav-button" th:href="@{/}">タイムラインへ戻る</a></header>
<main class="detail-shell"><nav th:replace="~{fragments/navigation :: rail('diaries')}"></nav><section class="layout detail-page">
  <header class="page-title"><nav class="breadcrumbs"><a th:href="@{/}"><span aria-hidden="true">⌂</span> 冒険記録</a><span>›</span><b><span aria-hidden="true">▤</span> 冒険日記</b></nav><p class="eyebrow">DAILY ADVENTURE ARCHIVE</p><h1>荒廃世界の冒険日記</h1><p>収集したログから振り返る、生存者たちの一日。</p></header>
  <section class="diary-archive">
    <article class="panel diary-public-card" th:each="entry : ${diaries}">
      <header><time th:text="${entry.date}">2026-08-02</time><span>FIELD JOURNAL</span></header>
      <h2 th:text="${entry.title}">ある日の冒険記録</h2>
      <p th:text="${entry.excerpt}">日記の抜粋</p>
      <div class="diary-tag-list" th:if="${!#lists.isEmpty(entry.tags)}"><span th:each="tag : ${entry.tags}" th:text="${tag}">探索</span></div>
      <footer><small th:text="${'登録 ' + entry.publishedAt}">登録日時</small><a th:href="@{/diaries/{date}(date=${entry.date})}">続きを読む <span aria-hidden="true">→</span></a></footer>
    </article>
    <p class="empty panel" th:if="${#lists.isEmpty(diaries)}">公開された冒険日記はまだありません。</p>
  </section>
</section></main></body></html>
