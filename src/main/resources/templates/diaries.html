<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/png" sizes="64x64" th:href="@{/img/watchpoint-icon-64.png}"><link rel="apple-touch-icon" th:href="@{/img/watchpoint-icon.png}"><title>冒険日記 | Watchpoint</title><link rel="stylesheet" th:href="@{/css/app.css(v='header-4')}"><link rel="stylesheet" th:href="@{/css/watchpoint.css(v='1')}"></head>
<body class="watchpoint-body">
<header th:replace="~{fragments/header :: appHeader('7dtd', 'watchpoint-topbar')}"></header>
<main class="detail-shell"><nav th:replace="~{fragments/navigation :: rail('diaries')}"></nav><section class="layout detail-page">
  <header class="page-title"><h1>冒険日記</h1></header>
  <section class="diary-archive">
    <article class="panel diary-public-card" th:each="entry : ${diaries}">
      <header><time th:text="${entry.date}">2026-08-02</time></header>
      <h2 th:text="${entry.title}">ある日の冒険記録</h2>
      <p th:text="${entry.excerpt}">日記の抜粋</p>
      <div class="diary-tag-list" th:if="${!#lists.isEmpty(entry.tags)}"><span th:each="tag : ${entry.tags}" th:text="${tag}">探索</span></div>
      <footer><small th:text="${'登録 ' + entry.publishedAt}">登録日時</small><a th:href="@{/diaries/{date}(date=${entry.date})}">続きを読む <span aria-hidden="true">→</span></a></footer>
    </article>
    <p class="empty panel" th:if="${#lists.isEmpty(diaries)}">公開された冒険日記はまだありません。</p>
  </section>
</section></main></body></html>
