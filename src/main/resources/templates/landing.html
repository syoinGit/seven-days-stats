<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WATCHPOINT | Wasteland Adventure Archive</title>
  <link rel="stylesheet" th:href="@{/css/app.css(v='20260809-4')}">
</head>
<body class="landing-body">
<main class="landing-shell">
  <section class="landing-hero">
    <div class="landing-brand"><span class="brand-mark">WP</span><span>WATCHPOINT</span></div>
    <p class="eyebrow">WASTELAND ADVENTURE ARCHIVE</p>
    <h1>荒野に残った、<br>生存者たちの記録。</h1>
    <p class="landing-copy">7 Days to Die のサーバーログから、探索・戦闘・旅路・日記を再構成するプライベート観測所。</p>
    <div class="landing-actions">
      <a class="landing-primary" th:href="@{/login}">観測所へアクセス</a>
      <form method="post" th:action="@{/guest-login}"><button class="landing-secondary" type="submit">匿名ゲストとして閲覧</button></form>
    </div>
    <small>GUEST MODEではプレイヤー名が匿名化されます。</small>
  </section>
  <aside class="landing-terminal" aria-label="watchpoint status">
    <p><span>SYS</span> WATCHPOINT NETWORK</p>
    <strong>PRIVATE<br>ARCHIVE</strong>
    <dl><div><dt>ACCESS</dt><dd>AUTHORIZATION REQUIRED</dd></div><div><dt>GUEST</dt><dd>IDENTITY MASKED</dd></div><div><dt>STATUS</dt><dd>MONITORING</dd></div></dl>
  </aside>
</main>
</body>
</html>
