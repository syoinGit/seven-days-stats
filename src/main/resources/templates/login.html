<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/png" sizes="64x64" href="/img/site-icon-64.png"><link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <title>ログイン | WATCHPOINT</title>
  <link rel="stylesheet" th:href="@{/css/app.css(v='20260809-7')}">
</head>
<body>
<header class="topbar">
  <a class="brand" th:href="@{/}"><span class="brand-mark">WP</span><span><b>WATCHPOINT</b><small>PLAYER ACCESS</small></span></a>
  <a class="nav-button" th:href="@{/}">入口へ戻る</a>
</header>
<main class="auth-shell">
  <section class="layout detail-page auth-page">
    <header class="page-title">
      <p class="eyebrow">SURVIVOR ACCESS</p>
      <h1>冒険者ログイン</h1>
      <p>ログインすると、投稿・いいね・自分のステータス更新が使えます。</p>
    </header>
    <article class="panel auth-panel">
      <div class="form-notice error" th:if="${param.error}">ログインIDまたはパスワードを確認してください。</div>
      <div class="form-notice success" th:if="${param.logout}">ログアウトしました。</div>
      <form class="ai-comment-form" method="post" th:action="@{/login}">
        <label><span>ログインID</span><input name="username" type="text" autocomplete="username" required autofocus></label>
        <label><span>パスワード</span><input name="password" type="password" autocomplete="current-password" required></label>
        <div class="form-actions"><small>アカウントは管理者が発行します。</small><button type="submit">ログイン</button></div>
      </form>
      <div class="guest-login-block">
        <p class="eyebrow">READ-ONLY ACCESS</p>
        <p>身内の活動記録を閲覧するだけなら、ゲストログインを利用できます。</p>
        <form method="post" th:action="@{/guest-login}"><button class="guest-button" type="submit">ゲストとして閲覧する</button></form>
      </div>
    </article>
  </section>
</main>
</body>
</html>
