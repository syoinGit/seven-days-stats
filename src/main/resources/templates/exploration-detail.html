<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/png" sizes="64x64" th:href="@{/img/watchpoint-icon-64.png}"><link rel="apple-touch-icon" th:href="@{/img/watchpoint-icon.png}"><title>探索済みPOI | Watchpoint</title><link rel="stylesheet" th:href="@{/css/app.css(v='header-6')}"><link rel="stylesheet" th:href="@{/css/watchpoint.css(v='3')}"></head>
<body class="watchpoint-body">
<header th:replace="~{fragments/header :: appHeader('7dtd', 'watchpoint-topbar')}"></header>
<main class="detail-shell"><nav th:replace="~{fragments/navigation :: rail('exploration')}"></nav><section class="layout detail-page">
  <header class="page-title"><h1>探索済みPOI</h1></header>
  <section class="metric-grid exploration-summary"><article class="metric-card"><span>探索済み</span><strong th:text="${exploration.exploredCount}">0</strong><small>か所</small></article><article class="metric-card"><span>未探索</span><strong th:text="${exploration.unexploredCount}">0</strong><small>か所</small></article><article class="metric-card"><span>POI総数</span><strong th:text="${exploration.totalCount}">0</strong><small>か所</small></article><article class="metric-card"><span>踏破率</span><strong th:text="${exploration.percentage + '%'}">0%</strong><small>探索済み / 総数</small></article></section>
  <article class="panel"><div class="panel-head"><h2>探索したPOI</h2><small>徒歩で80m以内に入った地点（乗り物での通過は除く）</small></div><div class="exploration-progress"><i th:style="${'width:' + exploration.percentage + '%'}"></i></div><div class="poi-cards"><article th:each="poi : ${exploration.pois}" class="discovered"><span class="poi-state">✓ 探索済み</span><h2 th:text="${poi.poiName}">POI</h2><p th:text="${poi.category}">分類</p><dl><div><dt>位置</dt><dd th:text="${poi.coordinate}">0,0,0</dd></div><div><dt>最終訪問者</dt><dd th:text="${poi.visitorName ?: '誰か'}">player</dd></div><div><dt>最終訪問日時</dt><dd th:text="${poi.visitedAt ?: '-'}">time</dd></div></dl></article><p th:if="${#lists.isEmpty(exploration.pois)}" class="empty">探索済みのPOIはまだありません。</p></div></article>
</section></main></body></html>
