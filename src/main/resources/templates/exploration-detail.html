<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/png" sizes="64x64" href="/img/site-icon-64.png"><link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png"><title>EXPLORATION | WATCHPOINT</title><link rel="stylesheet" th:href="@{/css/app.css(v='20260809-5')}"></head>
<body>
<header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">WP</span><span><b>WATCHPOINT</b><small>WASTELAND CARTOGRAPHY</small></span></a><a class="nav-button" th:href="@{/}">冒険タイムラインへ戻る</a></header>
<main class="detail-shell"><nav th:replace="~{fragments/navigation :: rail('exploration')}"></nav><section class="layout detail-page">
  <header class="page-title"><nav class="breadcrumbs"><a th:href="@{/}"><span aria-hidden="true">⌂</span> 冒険記録</a><span>›</span><b><span aria-hidden="true">⌖</span> 探索済みPOI</b></nav><p class="eyebrow">EXPEDITION / POI ARCHIVE</p><h1>探索済みPOI</h1><p>白紙だった地図に、生存者たちの足で印が刻まれていく。電波が据えた、帰還者たちの探索記録。</p></header>
  <section class="metric-grid exploration-summary"><article class="metric-card"><span>DISCOVERED</span><strong th:text="${exploration.exploredCount}">0</strong><small>探索済み</small></article><article class="metric-card"><span>UNCHARTED</span><strong th:text="${exploration.unexploredCount}">0</strong><small>未探索</small></article><article class="metric-card"><span>ALL POI</span><strong th:text="${exploration.totalCount}">0</strong><small>登録地点</small></article><article class="metric-card"><span>PROGRESS</span><strong th:text="${exploration.percentage + '%'}">0%</strong><small>荒野の踏破率</small></article></section>
  <article class="panel"><div class="panel-head"><h2>荒野探索台帳</h2><small>80m以内の位置ログで判定</small></div><div class="exploration-progress"><i th:style="${'width:' + exploration.percentage + '%'}"></i></div><div class="poi-cards"><article th:each="poi : ${exploration.pois}" class="discovered"><span class="poi-state">✓ 探索済み</span><h2 th:text="${poi.poiName}">POI</h2><p th:text="${poi.category}">分類</p><dl><div><dt>位置</dt><dd th:text="${poi.coordinate}">0,0,0</dd></div><div><dt>最終訪問者</dt><dd th:text="${poi.visitorName ?: '誰か'}">player</dd></div><div><dt>最終訪問日時</dt><dd th:text="${poi.visitedAt ?: '-'}">time</dd></div></dl></article><p th:if="${#lists.isEmpty(exploration.pois)}" class="empty">探索済みのPOIはまだありません。</p></div></article>
</section></main></body></html>
