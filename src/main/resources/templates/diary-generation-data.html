<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/png" sizes="64x64" href="/img/site-icon-64.png"><link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png"><title>DIARY DATA | WATCHPOINT</title><link rel="stylesheet" th:href="@{/css/app.css(v='20260809-8')}"><script defer th:src="@{/js/timeline.js(v='20260805-2')}"></script></head>
<body>
<header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">WP</span><span><b>WATCHPOINT</b><small>DIARY GENERATION DATA</small></span></a><a class="nav-button" th:href="@{/maintenance/diaries}">日別一覧へ戻る</a></header>
<main class="detail-shell"><nav th:replace="~{fragments/navigation :: rail('diary-maintenance')}"></nav><section class="layout detail-page">
  <header class="page-title"><nav class="breadcrumbs"><a th:href="@{/maintenance/diaries}"><span aria-hidden="true">▤</span> 日別冒険日記</a><span>›</span><b th:text="${packet.date}">date</b></nav><p class="eyebrow">AI INPUT / SOURCE DATA</p><h1 th:text="${packet.date + ' の生成データ'}">生成データ</h1><p th:text="${packet.gameDayLabel + ' / 最終観測 ' + packet.lastWorldTime}">world time</p></header>
  <p class="form-notice success" th:if="${notice}" th:text="${notice}">登録しました。</p>
  <section class="diary-metrics"><article><span>PLAYERS</span><strong th:text="${#lists.size(packet.participants)}">0</strong></article><article><span>EVENTS</span><strong th:text="${packet.eventCount}">0</strong></article><article><span>POI</span><strong th:text="${#lists.size(packet.pois)}">0</strong></article><article><span>WORLD</span><strong th:text="${packet.gameDayLabel}">--</strong></article></section>
  <article class="panel generation-packet"><div class="panel-head"><h2>AIへ渡すテキスト</h2><button type="button" data-copy-generation>コピー</button></div><textarea id="generation-data" readonly th:text="${packet.generationData}">generation data</textarea></article>
  <section class="diary-data-grid">
    <article class="panel"><div class="panel-head"><h2>プレイヤー別活動</h2><small>DAILY STATS</small></div><div class="diary-player-row" th:each="player : ${packet.participants}"><strong th:text="${player.name}">player</strong><span th:text="${'討伐 ' + player.kills + ' / 遭遇 ' + player.encounters}">stats</span><small th:text="${'開始 ' + player.startPlace}">start</small><small th:text="${'終了 ' + player.endPlace}">end</small><small th:text="${'位置移動 ' + #numbers.formatDecimal(player.positionDistance, 1, 1) + 'm / 乗り物 ' + #numbers.formatDecimal(player.vehicleDistance, 1, 1) + 'm'}">distance</small></div><p class="empty" th:if="${#lists.isEmpty(packet.participants)}">参加者なし</p></article>
    <article class="panel"><div class="panel-head"><h2>訪問POI</h2><small>OBSERVED</small></div><div class="diary-tag-list"><span th:each="poi : ${packet.pois}" th:text="${poi}">poi</span><p class="empty" th:if="${#lists.isEmpty(packet.pois)}">未記録</p></div></article>
  </section>
  <article class="panel registered-diary" th:if="${packet.diary != null}"><div class="panel-head"><h2>登録済みの日記</h2><a th:href="@{/maintenance/diaries/{date}/edit(date=${packet.date})}">修正する</a></div><h3 th:text="${packet.diary.title}">title</h3><p th:text="${packet.diary.body}">body</p></article>
  <form method="post" th:action="@{/maintenance/diaries/{date}/generate(date=${packet.date})}"><button class="primary-link" type="submit">WATCHPOINTに日記を書かせる</button></form>
  <a class="primary-link" th:href="@{/maintenance/diaries/{date}/edit(date=${packet.date})}" th:text="${packet.diary != null ? '登録済み日記を修正する' : '手動で日記を登録する'}">日記を登録</a>
</section></main></body></html>
