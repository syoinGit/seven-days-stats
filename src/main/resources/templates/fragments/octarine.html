<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<li th:fragment="eventRow(event)" class="octarine-event" th:classappend="${'kind-' + #strings.toLowerCase(event.kind)}">
  <time th:datetime="${event.observedAt}" th:text="${event.observedLabel}">---</time>
  <b th:text="${event.label}">大壁の解放</b>
  <small th:text="${event.kindLabel}">達成を確認</small>
</li>

<nav th:fragment="tabs" class="octarine-tabs" aria-label="Octarineのページ">
  <a th:href="@{/octarine}" th:classappend="${section == 'overview'} ? 'active'" th:attr="aria-current=${section == 'overview'} ? 'page'">概要</a>
  <a th:href="@{/octarine/items}" th:classappend="${section == 'items'} ? 'active'" th:attr="aria-current=${section == 'items'} ? 'page'">アイテム</a>
  <a th:href="@{/octarine/chests}" th:classappend="${section == 'chests'} ? 'active'" th:attr="aria-current=${section == 'chests'} ? 'page'">チェスト</a>
  <a th:href="@{/octarine/players}" th:classappend="${section == 'players'} ? 'active'" th:attr="aria-current=${section == 'players'} ? 'page'">接続とプレイ時間</a>
  <a th:href="@{/octarine/history}" th:classappend="${section == 'history'} ? 'active'" th:attr="aria-current=${section == 'history'} ? 'page'">履歴</a>
</nav>

<p th:fragment="snapshot" class="octarine-note octarine-snapshot" th:if="${ctx != null and ctx.snapshotLabel != null}"
   th:text="${'保存データの更新時刻 ' + ctx.snapshotLabel + ' 時点の内容です。ゲーム中の最新状態とは限りません。'}"></p>

<p th:fragment="namesMissing" class="octarine-warning-inline" th:if="${namesLoaded != null and !namesLoaded}">
  アイテム名の辞書がサーバーに置かれていないため、番号で表示しています。
</p>

<p th:fragment="amountNote" class="octarine-note">
  素材などは個数で数えます。武器・防具・道具は重ならないので、1枠を1個として数えます。分類はゲームのデータによります（名前表に分類が無いアイテムは「その他」）。
</p>

<svg th:fragment="icon(category)" class="ck-icon" th:classappend="${'ck-' + category.icon()}" viewBox="0 0 24 24" aria-hidden="true"><use th:href="@{'/img/octarine-icons.svg#' + ${category.icon()}}"></use></svg>

<ul th:fragment="legend" class="ck-legend" aria-label="アイコンの意味" th:if="${categories != null}">
  <li th:each="category : ${categories}"><svg th:replace="~{fragments/octarine :: icon(${category})}"></svg><span th:text="${category.label()}">武器</span></li>
</ul>

<span th:fragment="place(place)" class="octarine-place" th:if="${place != null}" th:text="${place.label()}">コアから東120・北40</span>
</body>
</html>
