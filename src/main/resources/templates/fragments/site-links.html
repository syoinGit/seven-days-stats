<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><body>
<!-- The game sites, shared by the portal header and every site header. current: a site name or 'portal'. -->
<nav th:fragment="links(current)" class="site-links" aria-label="ゲームサイト" th:if="${headerSites != null}">
  <a th:each="site : ${headerSites}" th:href="${site.url}" th:classappend="${'site-' + site.accent + (#strings.equalsIgnoreCase(site.name, current) ? ' active' : '')}"
     th:attr="aria-current=${#strings.equalsIgnoreCase(site.name, current)} ? 'page'">
    <span class="site-mark" aria-hidden="true" th:text="${site.id == 'terraria' ? '✦' : site.id == 'corekeeper' ? '◆' : '◈'}">◈</span>
    <span><b th:text="${site.name}">Watchpoint</b><small th:text="${site.game}">7 Days to Die</small></span>
  </a>
</nav>
</body></html>
