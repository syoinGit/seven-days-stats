<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="tabs" class="luminite-tabs" aria-label="Luminiteのページ">
  <a th:href="@{/luminite}" th:classappend="${section == 'overview'} ? 'active'" th:attr="aria-current=${section == 'overview'} ? 'page'">概要</a>
  <a th:href="@{/luminite/items}" th:classappend="${section == 'items'} ? 'active'" th:attr="aria-current=${section == 'items'} ? 'page'">アイテム</a>
  <a th:href="@{/luminite/chests}" th:classappend="${section == 'chests'} ? 'active'" th:attr="aria-current=${section == 'chests'} ? 'page'">チェスト検索</a>
  <a th:href="@{/luminite/bestiary}" th:classappend="${section == 'bestiary'} ? 'active'" th:attr="aria-current=${section == 'bestiary'} ? 'page'">討伐図鑑</a>
  <a th:href="@{/luminite/world}" th:classappend="${section == 'world'} ? 'active'" th:attr="aria-current=${section == 'world'} ? 'page'">ワールド</a>
  <a th:href="@{/luminite/deaths}" th:classappend="${section == 'deaths'} ? 'active'" th:attr="aria-current=${section == 'deaths'} ? 'page'">墓標と看板</a>
  <a th:href="@{/luminite/history}" th:classappend="${section == 'history'} ? 'active'" th:attr="aria-current=${section == 'history'} ? 'page'">履歴</a>
</nav>

<p th:fragment="snapshot" class="luminite-note luminite-snapshot" th:if="${ctx != null and ctx.snapshotLabel != null}"
   th:text="${'ワールドファイルの保存時刻 ' + ctx.snapshotLabel + ' 時点の内容です。ゲーム中の最新状態とは限りません。'}"></p>

<p th:fragment="namesMissing" class="luminite-warning" th:if="${namesLoaded != null and !namesLoaded}">
  アイテム名の辞書がサーバーに置かれていないため、番号で表示しています。
</p>

<span th:fragment="place(place)" class="luminite-place" th:if="${place != null}">
  <b th:text="${place.layer}">地下</b>
  <span th:text="${place.label()}">中心から東へ120ft / 地表から40ft下</span>
</span>
</body>
</html>
