<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><body>
<header th:fragment="header" class="portal-topbar">
  <a class="portal-logo" th:href="@{/portal}" aria-label="Rubinco ホーム">
    <span aria-hidden="true">R</span>
    <b>Rubinco</b>
  </a>
  <nav th:replace="~{fragments/site-links :: links('portal')}"></nav>
  <nav class="auth-nav" aria-label="アカウントメニュー">
    <a th:if="${!loggedIn}" class="nav-button" href="/portal?login" data-open-login>ログイン</a>
    <a th:if="${loggedIn and !currentViewer}" class="account-profile-link" aria-label="プロフィールを編集" th:href="${portalUrl + '/profile'}"><img class="user-avatar" th:src="${currentAvatar}" alt=""><span th:text="${currentDisplayName}"></span></a>
    <span th:if="${currentViewer}" class="account-profile-link"><img class="user-avatar" th:src="${currentAvatar}" alt="">ゲスト</span>
    <a th:if="${currentAdmin}" class="nav-button" th:href="${portalUrl + '/maintenance/accounts'}">メンテナンス</a>
    <form th:if="${loggedIn}" method="post" th:action="@{/logout}">
      <button class="nav-button" type="submit">ログアウト</button>
    </form>
  </nav>
</header>
</body></html>
