<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="rail(activePage)" class="rail global-rail" aria-label="冒険記録ナビゲーション">
  <div class="rail-top">
    <p class="rail-label">ADVENTURE RECORD</p>
    <a th:href="@{/dashboard}" th:classappend="${activePage == 'timeline'} ? 'active'"><span>01</span>冒険タイムライン</a>
    <a th:href="@{/kills}" th:classappend="${activePage == 'rankings'} ? 'active'"><span>02</span>冒険者ランキング</a>
    <a th:href="@{/vehicles}" th:classappend="${activePage == 'vehicles'} ? 'active'"><span>03</span>乗り物ランキング</a>
    <a th:href="@{/exploration}" th:classappend="${activePage == 'exploration'} ? 'active'"><span>04</span>探索済みPOI</a>
    <a th:href="@{/diaries}" th:classappend="${activePage == 'diaries'} ? 'active'"><span>AI</span>冒険日記</a>
    <a th:if="${currentAdmin}" th:href="@{/maintenance/accounts}" th:classappend="${activePage == 'maintenance'} ? 'active'"><span>ADM</span>アカウント管理</a>
    <a th:if="${currentAdmin}" th:href="@{/maintenance/diaries}" th:classappend="${activePage == 'diary-maintenance'} ? 'active'"><span>ADM</span>日誌メンテ</a>
    <a th:if="${currentAdmin}" th:href="@{/maintenance/ai-analysis/test}" th:classappend="${activePage == 'ai-test'} ? 'active'"><span>AI</span>Bedrockテスト</a>
    <p class="rail-copy">荒廃世界を生きた一日を、<br>記録からもう一度楽しむ。</p>
  </div>
  <a class="server-nav" th:classappend="${activePage == 'server'} ? 'active'" th:href="@{/server}"><span>SYS</span>サーバー情報</a>
</nav>
</body>
</html>
