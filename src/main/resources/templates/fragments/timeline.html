<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="page">
  <li class="feed-item" th:each="item : ${timelinePage.items}" data-timeline-item
      th:classappend="${' tone-' + item.tone}">
    <img class="feed-avatar system-avatar" th:if="${!#strings.isEmpty(item.avatarUrl())}"
         th:src="${item.avatarUrl()}" th:alt="${item.actor}">
    <div class="feed-avatar" th:unless="${!#strings.isEmpty(item.avatarUrl())}"
         th:text="${#strings.substring(item.actor, 0, 1)}">W</div>
    <div class="feed-body">
      <header>
        <a class="feed-actor" th:if="${item.playerId != null and !currentViewer}"
           th:href="@{/players/{id}(id=${item.playerId})}" th:text="${item.actor}">survivor</a>
        <strong th:if="${item.playerId == null or currentViewer}" th:text="${item.actor}">observer</strong>
        <span class="tag" th:text="${item.tag}">観測情報</span>
        <time th:text="${item.occurredAt ?: '-'}">time</time>
      </header>
      <p class="event-message" th:text="${item.message}">荒野で何かが起きた</p>
      <a class="feed-media" th:if="${!#strings.isEmpty(item.imageUrl)}"
         th:href="${item.imageUrl}" target="_blank" rel="noopener noreferrer"
         aria-label="投稿画像を拡大表示">
        <img th:src="${item.imageUrl}" th:alt="${item.actor + 'の投稿画像'}" loading="lazy" decoding="async">
      </a>
      <a class="timeline-card-link" th:if="${!#strings.isEmpty(item.linkUrl)}"
         th:href="${item.linkUrl}" th:text="${item.linkLabel}">詳しく見る</a>
      <footer class="social-actions" th:if="${(loggedIn and !currentViewer) or item.reactionCount() > 0 or item.baseLikeCount > 0 or item.ownPost}">
        <span class="karen-popularity" th:if="${item.baseLikeCount > 0}"
              th:text="${'♡ ' + #numbers.formatInteger(item.displayLikeCount(), 1, 'COMMA')}">♡ 1,284</span>
        <div class="reaction-counts" th:if="${item.reactionCount() > 0}">
          <span class="reaction-count" th:each="reaction : ${item.reactions}" th:unless="${reaction.value == 0}"
                th:text="${reaction.key.emoji() + ' ' + reaction.value}">👍 1</span>
        </div>
        <details class="reaction-menu" th:if="${loggedIn and !currentViewer}">
          <summary aria-label="リアクションする"><span aria-hidden="true">＋☺</span></summary>
          <div class="reaction-options">
            <form class="reaction-form" method="post" th:action="@{/posts/{id}/react(id=${item.postId})}"
                  th:if="${loggedIn and !currentViewer}" th:each="reaction : ${item.reactions}">
              <input type="hidden" name="reaction" th:value="${reaction.key.name()}">
              <button class="like-button" th:classappend="${item.currentReaction == reaction.key.name()}"
                      type="submit"><span th:text="${reaction.key.emoji()}">👍</span>
                <span th:text="${reaction.value}">0</span></button>
            </form>
          </div>
        </details>
        <form class="delete-post-form" method="post" th:action="@{/posts/{id}/delete(id=${item.postId})}"
              th:if="${item.ownPost}">
          <button class="delete-post-button" type="submit">削除</button>
        </form>
      </footer>
      <footer th:if="${!#strings.isEmpty(item.coordinate)}">
        <span>LOC</span><b th:text="${item.coordinate}">0, 0, 0</b>
      </footer>
    </div>
  </li>
  <template data-timeline-page-meta th:attr="data-next-offset=${timelinePage.nextOffset},data-has-more=${timelinePage.hasMore}"></template>
</th:block>
</body>
</html>
