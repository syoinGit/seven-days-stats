<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"><body>
<dialog th:fragment="modal" id="portal-login" class="portal-login-shell portal-login-modal" aria-labelledby="portal-login-title" th:attr="open=${loginRequested ? 'open' : null}">
  <form method="dialog" class="modal-close-form"><a class="nav-button modal-close-fallback" href="/portal">閉じる</a><button class="nav-button modal-close-button" aria-label="ログインを閉じる">閉じる ×</button></form>
  <h1 id="portal-login-title">仲間だけの世界へ。</h1>
  <p id="portal-login-description">
    招待されたアカウントでログインすると、Watchpoint・Luminite・Octarineを同じアカウントで利用できます。
  </p>
  <div class="form-notice error" th:if="${param.error}" role="alert"
       th:text="${cognitoEnabled ? '共通ログインに失敗しました。招待状態を確認してください。' : 'ログインIDまたはパスワードを確認してください。'}"></div>
  <div class="form-notice success" th:if="${param.logout}">ログアウトしました。</div>
  <form class="ai-comment-form" th:if="${!cognitoEnabled}" method="post" th:action="@{/login}">
    <label><span>ログインID</span><input name="username" type="text" autocomplete="username" required autofocus></label>
    <label><span>パスワード</span><input name="password" type="password" autocomplete="current-password" required></label>
    <button class="portal-login-button" type="submit">ポータルにログイン</button>
  </form>
  <a class="portal-login-button" th:if="${cognitoEnabled}"
     th:href="${loginUrl}"
     th:text="${cognitoEnabled ? 'SSOでログイン' : 'ログイン'}"
     aria-describedby="portal-login-description portal-invite-note">ログイン</a>
  <div class="guest-login-block" th:if="${!cognitoEnabled}">
    <form method="post" th:action="@{/guest-login}"><button class="guest-button" type="submit">ゲストとして閲覧する</button></form>
  </div>
  <small id="portal-invite-note">公開ユーザー登録は受け付けていません。</small>

</dialog>
</body></html>
