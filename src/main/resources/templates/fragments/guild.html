<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><th:block th:fragment="meta(title)">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title th:text="${title + ' | Rubinco'}"></title>
<meta name="description" content="ゲームの記録から生まれた創作の住人たち。小さなギルド兼酒場で、その暮らしを眺めよう。">
<meta property="og:title" th:content="${title}"><meta property="og:type" content="website">
<link th:if="${canonical != null and !#strings.isEmpty(canonical)}" rel="canonical" th:href="${canonical}">
<meta th:if="${canonical != null and !#strings.isEmpty(canonical)}" property="og:url" th:content="${canonical}">
<link rel="stylesheet" href="/css/app.css?v=header-5"><link rel="stylesheet" href="/css/portal.css?v=guild-1"><link rel="stylesheet" href="/css/guild.css?v=27">
</th:block></head><body>
<!-- The small figure carries validated, saved portrait choices for the counter-view player. -->
<svg th:fragment="sprite(c)" th:replace="~{fragments/guild :: figure(${c}, ${c.pose()})}"></svg>
<svg th:fragment="figure(c, pose)" class="guild-sprite" th:classappend="${c.appearance}" viewBox="0 0 96 144" aria-hidden="true"
     th:style="${c.look != null ? c.look.style() : null}"
     th:attr="data-portrait-layers=${#strings.listJoin(c.portraitLayers(), ',')}, data-outfit=${c.look != null ? c.look.outfit : 'adventurer'}, data-pose=${pose}">
  <use th:each="layer : ${c.spriteLayers(pose)}" th:href="${'/img/guild-people.svg?v=7#' + layer}"></use>
</svg>
<!-- The guild's bottom tabs. Each one but maintenance opens a window over the tavern; active: tavern, dungeon or log. -->
<nav th:fragment="tabbar(active)" class="guild-tabbar" aria-label="ギルド" data-guild-tabbar>
  <a href="/guild" th:attr="aria-current=${active == 'tavern'} ? 'page'"><svg viewBox="0 0 16 16" aria-hidden="true"><use href="/img/guild-icons.svg?v=4#tab-tavern"></use></svg>酒場</a>
  <a href="/guild/dungeon" th:attr="aria-current=${active == 'dungeon'} ? 'page'"><svg viewBox="0 0 16 16" aria-hidden="true"><use href="/img/guild-icons.svg?v=4#tab-dungeon"></use></svg>冒険</a>
  <a href="/guild/brew" th:attr="aria-current=${active == 'brew'} ? 'page'"><svg viewBox="0 0 16 16" aria-hidden="true"><use href="/img/guild-icons.svg?v=4#tab-beer"></use></svg>ビール</a>
  <a href="/guild/log" th:attr="aria-current=${active == 'log'} ? 'page'"><svg viewBox="0 0 16 16" aria-hidden="true"><use href="/img/guild-icons.svg?v=4#tab-log"></use></svg>記録</a>
  <a th:if="${currentAdmin}" href="/guild/maintenance"><svg viewBox="0 0 16 16" aria-hidden="true"><use href="/img/guild-icons.svg?v=4#tab-maintenance"></use></svg>メンテ</a>
</nav>
</body></html>
