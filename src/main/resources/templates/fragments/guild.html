<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><th:block th:fragment="meta(title)">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title th:text="${title + ' | Rubinco'}"></title>
<meta name="description" content="ゲームの記録から生まれた創作の住人たち。小さなギルド兼酒場で、その暮らしを眺めよう。">
<meta property="og:title" th:content="${title}"><meta property="og:type" content="website">
<link th:if="${canonical != null and !#strings.isEmpty(canonical)}" rel="canonical" th:href="${canonical}">
<meta th:if="${canonical != null and !#strings.isEmpty(canonical)}" property="og:url" th:content="${canonical}">
<link rel="stylesheet" href="/css/app.css?v=header-5"><link rel="stylesheet" href="/css/portal.css?v=guild-1"><link rel="stylesheet" href="/css/guild.css?v=3">
</th:block></head><body>
<!-- The guild's bottom tabs. Each one but maintenance opens a window over the tavern; active: tavern, visitors, roster or board. -->
<nav th:fragment="tabbar(active)" class="guild-tabbar" aria-label="ギルド" data-guild-tabbar>
  <a href="/guild" th:attr="aria-current=${active == 'tavern'} ? 'page'"><svg viewBox="0 0 16 16" aria-hidden="true"><use href="/img/guild-icons.svg?v=1#tab-tavern"></use></svg>酒場</a>
  <a href="/guild/visitors" th:attr="aria-current=${active == 'visitors'} ? 'page'"><svg viewBox="0 0 16 16" aria-hidden="true"><use href="/img/guild-icons.svg?v=1#tab-visitors"></use></svg>来店者</a>
  <a href="/guild/characters" th:attr="aria-current=${active == 'roster'} ? 'page'"><svg viewBox="0 0 16 16" aria-hidden="true"><use href="/img/guild-icons.svg?v=1#tab-roster"></use></svg>住人名簿</a>
  <a href="/guild/board" th:attr="aria-current=${active == 'board'} ? 'page'"><svg viewBox="0 0 16 16" aria-hidden="true"><use href="/img/guild-icons.svg?v=1#tab-board"></use></svg>掲示板</a>
  <a th:if="${currentAdmin}" href="/guild/maintenance"><svg viewBox="0 0 16 16" aria-hidden="true"><use href="/img/guild-icons.svg?v=1#tab-maintenance"></use></svg>メンテ</a>
</nav>
</body></html>
