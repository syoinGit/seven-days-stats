<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/png" sizes="64x64" th:href="@{/img/watchpoint-icon-64.png}"><link rel="apple-touch-icon" th:href="@{/img/watchpoint-icon.png}"><title th:text="${diary.title + ' | Watchpoint'}">冒険日記 | Watchpoint</title><link rel="stylesheet" th:href="@{/css/app.css(v='header-5')}"><link rel="stylesheet" th:href="@{/css/watchpoint.css(v='2')}"></head>
<body class="watchpoint-body">
<header th:replace="~{fragments/header :: appHeader('7dtd', 'watchpoint-topbar')}"></header>
<main class="detail-shell"><nav th:replace="~{fragments/navigation :: rail('diaries')}"></nav><section class="layout detail-page">
  <header class="page-title"><h1 th:text="${diary.title}">日記タイトル</h1></header>
  <article class="panel diary-public-detail">
    <header><time th:text="${diary.date}">date</time></header>
    <p class="diary-summary" th:if="${diary.summary != null and !#strings.isEmpty(diary.summary)}" th:text="${diary.summary}">要約</p>
    <div class="diary-tag-list" th:if="${!#lists.isEmpty(diary.tags)}"><span th:each="tag : ${diary.tags}" th:text="${tag}">探索</span></div>
    <p th:text="${diary.body}">日記本文</p>
    <footer><small th:text="${'登録 ' + diary.publishedAt}">登録日時</small></footer>
  </article>
  <a class="primary-link" th:href="@{/diaries}">冒険日記の一覧へ戻る</a>
</section></main></body></html>
