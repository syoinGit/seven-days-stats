<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/png" sizes="64x64" th:href="@{/img/watchpoint-icon-64.png}"><link rel="apple-touch-icon" th:href="@{/img/watchpoint-icon.png}"><title>乗り物ランキング | Watchpoint</title><link rel="stylesheet" th:href="@{/css/app.css(v='header-5')}"><link rel="stylesheet" th:href="@{/css/watchpoint.css(v='1')}"></head>
<body class="watchpoint-body">
<header th:replace="~{fragments/header :: appHeader('7dtd', 'watchpoint-topbar')}"></header>
<main class="detail-shell"><nav th:replace="~{fragments/navigation :: rail('vehicles')}"></nav><section class="layout detail-page">
  <header class="page-title"><h1>乗り物ランキング</h1></header>
  <section class="metric-grid"><article class="metric-card"><span>走った車両</span><strong th:text="${vehicles.summary.vehicleCount}">0</strong><small>台</small></article><article class="metric-card"><span>追跡中</span><strong th:text="${vehicles.summary.activeCount}">0</strong><small>台</small></article><article class="metric-card"><span>運転した人</span><strong th:text="${vehicles.summary.driverCount}">0</strong><small>人</small></article><article class="metric-card"><span>合計走行距離</span><strong th:text="${#numbers.formatDecimal(vehicles.summary.totalDistance, 1, 1)}">0</strong><small>m</small></article></section>
  <section class="insight-grid vehicle-insights"><article class="panel activity-panel"><div class="panel-head"><h2>乗り物移動の日次推移</h2><small>直近14活動日</small></div><div class="activity-chart compact-chart"><div class="activity-day" th:each="day : ${vehicles.dailyDistances}"><span th:text="${#numbers.formatDecimal(day.distance, 1, 0)}">0</span><div><i class="vehicle-bar" th:style="${'height:' + day.percentage + '%'}"></i></div><small th:text="${day.day}">day</small></div><p th:if="${#lists.isEmpty(vehicles.dailyDistances)}" class="empty">移動記録がありません。</p></div></article><article class="panel"><div class="panel-head"><h2>車種別走行記録</h2><small>全車両</small></div><ol class="vehicle-type-ranking"><li th:each="type, stat : ${vehicles.typeRankings}"><b th:text="${'#' + (stat.index + 1)}">#1</b><span><strong th:text="${type.vehicleName}">vehicle</strong><small th:text="${type.vehicleCount + '台'}">0台</small></span><em><span th:text="${#numbers.formatDecimal(type.totalDistance, 1, 1)}">0</span>m</em></li><li th:if="${#lists.isEmpty(vehicles.typeRankings)}" class="empty">車種記録がありません。</li></ol></article></section>
  <section class="vehicle-grid"><article class="vehicle-card" th:each="vehicle, stat : ${vehicles.vehicles}" th:classappend="${vehicle.active == false} ? ' inactive'"><header><span><b class="vehicle-rank" th:text="${'#' + (stat.index + 1)}">#1</b></span><b th:text="${vehicle.vehicleCount + '台'}">1 VEHICLE</b></header><h2><span th:text="${vehicle.driverName}">player</span><small> が </small><span th:text="${vehicle.vehicleName}">vehicle</span><small> で移動</small></h2><dl><div><dt>運転者</dt><dd th:text="${vehicle.driverName}">player</dd></div><div><dt>車種</dt><dd th:text="${vehicle.vehicleName}">vehicle</dd></div><div><dt>走行距離</dt><dd><span th:text="${#numbers.formatDecimal(vehicle.totalDistance ?: 0, 1, 1)}">0.0</span> m</dd></div><div><dt>最後の走行</dt><dd th:text="${vehicle.lastUpdated ?: '-'}">-</dd></div></dl></article><p th:if="${#lists.isEmpty(vehicles.vehicles)}" class="empty panel">運転者まで確認できた乗り物記録はまだありません。</p></section>
</section></main></body></html>
