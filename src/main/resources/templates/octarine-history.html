<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${'進捗の履歴 | ' + game.displayName}">進捗の履歴 | Octarine</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/img/site-icon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" th:href="@{/css/app.css(v='profile-1')}">
  <link rel="stylesheet" th:href="@{/css/octarine.css(v='1')}">
</head>
<body class="octarine-body">
<header th:replace="~{fragments/navigation :: siteHeader(@{/octarine}, ${game.displayName}, '◆', 'CORE KEEPER EXPEDITION LOG', 'octarine-topbar')}"></header>
<main class="octarine-shell">
  <section class="octarine-panel" aria-labelledby="octarine-history-title">
    <div class="section-heading">
      <div>
        <p class="eyebrow">HISTORY</p>
        <h1 id="octarine-history-title">進捗の履歴</h1>
      </div>
      <a th:href="@{/octarine(spoilers=${spoilers})}">← Octarineへ戻る</a>
    </div>
    <p class="octarine-note">
      日時はサイトが初めて確認した時刻です。「状態が後退」はバックアップ復元などで保存内容が戻った場合にも記録されます。
      「解析方式の更新による変更」はゲーム内の進行ではありません。
    </p>
    <p th:if="${events.isEmpty()}" class="octarine-empty">まだ変化の記録はありません。</p>
    <ol class="octarine-events" th:unless="${events.isEmpty()}">
      <th:block th:each="event : ${events.content}"><li th:replace="~{fragments/octarine :: eventRow(${event})}"></li></th:block>
    </ol>
    <nav class="portal-feed-pages" aria-label="履歴のページ">
      <a th:if="${events.hasPrevious()}" th:href="@{/octarine/history(page=${events.number - 1},spoilers=${spoilers})}">← 新しい記録</a>
      <a th:if="${events.hasNext()}" th:href="@{/octarine/history(page=${events.number + 1},spoilers=${spoilers})}">過去の記録 →</a>
    </nav>
  </section>
</main>
</body>
</html>
