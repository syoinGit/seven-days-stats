<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>プロフィール | Rubinco</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/img/site-icon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" th:href="@{/css/app.css(v='profile-1')}">
  <link rel="stylesheet" th:href="@{/css/portal.css(v='1')}">
</head>
<body class="portal-body">
<header th:replace="~{fragments/portal-header :: header}"></header>
<main class="profile-page">
  <a class="profile-back" th:href="${portalUrl}">← ポータルへ戻る</a>
  <p class="eyebrow">YOUR PROFILE</p>
  <h1>あなたのプロフィール</h1>
  <p class="profile-description">ここで選んだアイコンを、ポータルと連携済みのプレイヤープロフィールで使います。</p>
  <div class="form-notice success" th:if="${notice}" th:text="${notice}" role="status"></div>
  <div class="form-notice error" th:if="${error}" th:text="${error}" role="alert"></div>
  <form class="profile-editor" method="post" th:action="@{/portal/profile}">
    <div class="profile-summary"><img class="user-avatar profile-avatar" th:src="${currentAvatar}" alt=""><span th:text="${currentDisplayName}"></span></div>
    <label class="profile-name">表示名<input name="displayName" maxlength="40" required th:value="${currentProfile.displayName}" autocomplete="nickname"></label>
    <fieldset class="avatar-choices"><legend>アイコン</legend>
      <label class="avatar-choice" th:each="key : ${avatarOptions}">
        <input type="radio" name="avatarKey" th:value="${key}" th:checked="${key == currentProfile.avatarKey}" required>
        <img th:src="${'/img/avatars/' + key + '.svg'}" th:alt="${key}"><span th:text="${key}"></span>
      </label>
    </fieldset>
    <p class="profile-description" th:if="${currentPlayerId != null}">7DTDのプレイヤーと連携済みです。ゲーム内の名前は変更されません。</p>
    <p class="profile-description" th:if="${currentPlayerId == null}">ゲームプレイヤーは未連携です。ポータルはこのまま利用できます。</p>
    <button class="profile-save" type="submit">変更を保存</button>
  </form>
</main>
</body>
</html>
