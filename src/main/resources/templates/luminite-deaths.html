<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Terrariaのワールドデータから作る統計・アイテム検索サイト">
  <title th:text="${'墓標と看板 | ' + game.displayName}">Luminite | Terraria</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/img/site-icon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" th:href="@{/css/app.css(v='header-1')}">
  <link rel="stylesheet" th:href="@{/css/luminite.css(v='1')}">
</head>
<body class="luminite-body">
<header th:replace="~{fragments/navigation :: siteHeader(@{/luminite}, ${game.displayName}, '✦', 'TERRARIA EXPLORATION HUB', 'luminite-topbar')}"></header>
<main class="luminite-shell">
  <nav th:replace="~{fragments/luminite :: tabs}"></nav>
  <section class="luminite-panel" aria-labelledby="deaths-title">
    <div class="section-heading">
      <div><p class="eyebrow">GRAVEYARD</p><h1 id="deaths-title">墓標</h1></div>
      <span class="luminite-count" th:text="${#lists.size(tombstones) + '基'}">0基</span>
    </div>
    <div th:replace="~{fragments/luminite :: snapshot}"></div>
    <p class="luminite-note">ワールドに残っている墓石の碑文です。壊された墓石は消えるため、すべての死亡記録ではありません。「初回取り込み時からあった」墓石は、いつ置かれたか分かりません。</p>
    <p th:if="${#lists.isEmpty(tombstones)}" class="luminite-empty">墓石はありません。平和です。</p>
    <ul class="luminite-signs" th:unless="${#lists.isEmpty(tombstones)}">
      <li th:each="sign : ${tombstones}" class="tombstone">
        <p th:text="${sign.text}">ガイル couldn't breathe.</p>
        <small>
          <span th:replace="~{fragments/luminite :: place(${sign.place})}"></span>
          <span th:text="${sign.firstSeen == null ? '初回取り込み時からあった' : sign.firstSeen + ' に確認'}"></span>
        </small>
      </li>
    </ul>
  </section>
  <section class="luminite-panel" aria-labelledby="signs-title">
    <div class="section-heading">
      <div><p class="eyebrow">SIGNS</p><h2 id="signs-title">看板</h2></div>
      <span class="luminite-count" th:text="${#lists.size(signs) + '枚'}">0枚</span>
    </div>
    <p th:if="${#lists.isEmpty(signs)}" class="luminite-empty">文字が書かれた看板はありません。</p>
    <ul class="luminite-signs" th:unless="${#lists.isEmpty(signs)}">
      <li th:each="sign : ${signs}">
        <p th:text="${sign.text}">看板の文字</p>
        <small><span th:replace="~{fragments/luminite :: place(${sign.place})}"></span></small>
      </li>
    </ul>
  </section>
</main>
</body>
</html>
