spring:
  application:
    name: rubinco
  datasource:
    # Keep the existing database name; the Rubinco rename does not migrate stored data.
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/seven_days_stats
    username: postgres
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    session:
      cookie:
        http-only: true
        name: RUBINCO_SESSION
        same-site: lax
        secure: false
      timeout: 30m
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

app:
  guild:
    enabled: ${GUILD_ENABLED:false}
    recent-days: ${GUILD_RECENT_DAYS:30}
    recent-ratio: ${GUILD_RECENT_RATIO:0.5}
    public-url: ${GUILD_PUBLIC_URL:}
    daily-limit: ${GUILD_DAILY_LIMIT:5}
    # Among the last category-window residents, at most category-cap come from one kind of memory, and a
    # gender / occupation / name lineage that gender-cap / occupation-cap / lineage-cap of them have is not offered.
    category-window: ${GUILD_CATEGORY_WINDOW:10}
    category-cap: ${GUILD_CATEGORY_CAP:3}
    gender-cap: ${GUILD_GENDER_CAP:7}
    occupation-cap: ${GUILD_OCCUPATION_CAP:3}
    lineage-cap: ${GUILD_LINEAGE_CAP:5}
    # Interactions between today's visitors at these JST hours, twice in each hour, at most six a day. fallback: template or skip when the AI fails.
    # The server is up 20:00-23:30 JST: a slot every quarter hour from 20:00, the last one over by the end (23:15).
    interaction-hours: ${GUILD_INTERACTION_HOURS:20,21,22,23}
    interaction-end: ${GUILD_INTERACTION_END:23:30}
    interaction-daily-max: ${GUILD_INTERACTION_DAILY_MAX:12}
    interaction-fallback: ${GUILD_INTERACTION_FALLBACK:template}
    recent-pair-slots: ${GUILD_RECENT_PAIR_SLOTS:3}
    # Provisional dungeon runs: 1-4 of the day's visitors leave at this JST time; the four stages come out this many minutes apart.
    dungeon-departure: ${GUILD_DUNGEON_DEPARTURE:21:50}
    dungeon-stage-minutes: ${GUILD_DUNGEON_STAGE_MINUTES:10}
    selection-weights:
      random: 3
      warm: 2
      cold: 1
      bond: 2
      thread: 2
      affiliation: 2
  platform:
    domain: ${DOMAIN:rubinco.link}
    portal-url: ${PORTAL_SITE_URL:https://portal.${app.platform.domain}}
    watchpoint-url: ${WATCHPOINT_SITE_URL:https://watchpoint.${app.platform.domain}}
    luminite-url: ${LUMINITE_SITE_URL:https://luminite.${app.platform.domain}}
    octarine-url: ${OCTARINE_SITE_URL:https://octarine.${app.platform.domain}}
    auth-url: ${AUTH_SITE_URL:https://auth.${app.platform.domain}}
    api-url: ${API_BASE_URL:https://api.${app.platform.domain}}
    allowed-origins:
      - ${app.platform.portal-url}
      - ${app.platform.watchpoint-url}
      - ${app.platform.luminite-url}
      - ${app.platform.octarine-url}
    cognito:
      enabled: false
  games:
    # Game reservations only; leave the remaining host RAM for Linux, Java and PostgreSQL.
    memory-budget-mib: ${GAME_MEMORY_BUDGET_MIB:2560}
    # Opt in on EC2 after applying the container boot policy in docs/GAME_SERVERS.md.
    start-provider: ${GAME_SERVER_START_PROVIDER:mock}
    catalog:
      - id: 7dtd
        memory-mib: ${SEVEN_DAYS_MEMORY_MIB:2048}
        display-name: Watchpoint
        site-name: 7 Days to Die
        site-url: ${app.platform.watchpoint-url}
        accent: amber
        version: "Alpha 22"
        stage: "第1章・荒野の観測"
        progress: 18
        schedule: "サイトから起動"
        connection: "接続情報は準備中です"
      - id: terraria
        memory-mib: ${TERRARIA_MEMORY_MIB:512}
        manual-start: false
        display-name: ${TERRARIA_SITE_NAME:Luminite}
        site-name: Terraria
        site-url: ${app.platform.luminite-url}
        accent: violet
        version: "1.4.4"
        stage: "星明かりの地下層"
        progress: 42
        schedule: "EC2起動時に自動起動"
        connection: "接続情報は準備中です"
      - id: corekeeper
        memory-mib: ${COREKEEPER_MEMORY_MIB:1024}
        display-name: ${COREKEEPER_SITE_NAME:Octarine}
        site-name: Core Keeper
        site-url: ${app.platform.octarine-url}
        accent: magenta
        version: "サーバー設定に準拠"
        stage: "冒険の記録を待っています"
        progress: 0
        schedule: "サイトから起動"
        connection: "接続先は管理者に確認してください"
      - id: minecraft
        memory-mib: ${MINECRAFT_MEMORY_MIB:1024}
        display-name: Minecraft
        site-name: Minecraft
        site-url: ${app.platform.portal-url}
        site-enabled: false
        accent: emerald
        version: "サーバー設定に準拠"
        stage: "冒険の記録を待っています"
        progress: 0
        schedule: "サイトから起動"
        connection: "接続先は管理者に確認してください"
  corekeeper:
    # Read-only copy source. Production path is set in application-production.yml.
    world-file: ${COREKEEPER_WORLD_FILE:corekeeper/server-data/worlds/0.world.gzip}
    import-enabled: ${COREKEEPER_IMPORT_ENABLED:false}
    # Object name table generated from the game (docs/OCTARINE.md); kept out of the repository.
    names-dir: ${COREKEEPER_NAMES_DIR:}
    import-interval: ${COREKEEPER_IMPORT_INTERVAL:10m}
    max-compressed-size: ${COREKEEPER_MAX_COMPRESSED_SIZE:64MB}
    max-decompressed-size: ${COREKEEPER_MAX_DECOMPRESSED_SIZE:256MB}
    parse-timeout: 60s
    run-retention: ${COREKEEPER_IMPORT_RUN_RETENTION:90d}
    # Connections and play time from the server log (docs/OCTARINE.md). Needs the logs corekeeper helper.
    log-stream-enabled: ${COREKEEPER_LOG_STREAM_ENABLED:false}
  terraria:
    # Read-only copy source. Not guessed: set TERRARIA_WORLD_FILE to the server's .wld.
    world-file: ${TERRARIA_WORLD_FILE:}
    import-enabled: ${TERRARIA_IMPORT_ENABLED:false}
    # Name tables generated from the game (docs/LUMINITE.md); kept out of the repository.
    names-dir: ${TERRARIA_NAMES_DIR:}
    import-interval: ${TERRARIA_IMPORT_INTERVAL:5m}
    max-file-size: ${TERRARIA_MAX_FILE_SIZE:64MB}
    parse-timeout: 60s
    run-retention: ${TERRARIA_IMPORT_RUN_RETENTION:90d}
  sevendays:
    environment-name: local
    mode: file
    root: 7dtd
    import:
      startup-enabled: true
      scheduled-enabled: false
      fixed-delay: 10m
    log:
      scheduled-enabled: false
      fixed-delay: 10m
      initial-delay: 10m
      server-metric-interval: 1m
    docker:
      container-name: 7dtd
      log-since: 5m
      reconnect-delay: 5s
    telnet:
      host: 127.0.0.1
      port: 8081
      enabled: false
      initial-delay: 30s
      lp-interval: 60s
      read-timeout: 15s
    transaction:
      current-state-max-age: 120s
    poi:
      translation-resource: classpath:poi-translations.csv
  auth:
    bootstrap:
      login: admin
  ai:
    enabled: false
    aws-region: ap-northeast-1
    model-id: jp.anthropic.claude-haiku-4-5-20251001-v1:0
    window-minutes: 30
    max-events: 60
    system-prompt-resource: classpath:prompts/watchpoint-system-prompt.txt
    max-output-tokens: 240
  # The AI's murmur (AiMurmurService): once per interval across every game, about one server picked at random among
  # those online with someone connected (7DTD when app.ai is enabled, Core Keeper when world-ai is). Nobody on: none.
  world-ai:
    enabled: false
    interval: ${AI_MURMUR_INTERVAL:1h}
    max-output-tokens: 300
