spring:
  application:
    name: rubinco
  datasource:
    # Keep the existing database name; the Rubinco rename does not migrate stored data.
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/seven_days_stats
    username: postgres
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    session:
      cookie:
        http-only: true
        name: RUBINCO_SESSION
        same-site: lax
        secure: false
      timeout: 30m
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

app:
  platform:
    domain: ${DOMAIN:rubinco.link}
    portal-url: ${PORTAL_SITE_URL:https://portal.${app.platform.domain}}
    watchpoint-url: ${WATCHPOINT_SITE_URL:https://watchpoint.${app.platform.domain}}
    luminite-url: ${LUMINITE_SITE_URL:https://luminite.${app.platform.domain}}
    auth-url: ${AUTH_SITE_URL:https://auth.${app.platform.domain}}
    api-url: ${API_BASE_URL:https://api.${app.platform.domain}}
    allowed-origins:
      - ${app.platform.portal-url}
      - ${app.platform.watchpoint-url}
      - ${app.platform.luminite-url}
    cognito:
      enabled: false
  games:
    # No AWS API is called unless a separately reviewed provider is implemented and selected.
    start-provider: mock
    catalog:
      - id: 7dtd
        display-name: Watchpoint
        site-name: 7 Days to Die
        site-url: ${app.platform.watchpoint-url}
        accent: amber
        version: "Alpha 22"
        stage: "第1章・荒野の観測"
        progress: 18
        schedule: "毎日 18:00–23:30 JST"
        connection: "接続情報は準備中です"
      - id: terraria
        display-name: ${TERRARIA_SITE_NAME:Luminite}
        site-name: Terraria
        site-url: ${app.platform.luminite-url}
        accent: violet
        version: "1.4.4"
        stage: "星明かりの地下層"
        progress: 42
        schedule: "週末 20:00–23:30 JST"
        connection: "接続情報は準備中です"
  sevendays:
    environment-name: local
    mode: file
    root: 7dtd
    import:
      startup-enabled: true
      scheduled-enabled: false
      fixed-delay: 10m
    log:
      scheduled-enabled: false
      fixed-delay: 10m
      initial-delay: 10m
      server-metric-interval: 1m
    docker:
      container-name: 7dtd
      log-since: 5m
      reconnect-delay: 5s
    telnet:
      host: 127.0.0.1
      port: 8081
      enabled: false
      initial-delay: 30s
      lp-interval: 60s
      read-timeout: 15s
    transaction:
      current-state-max-age: 120s
    poi:
      translation-resource: classpath:poi-translations.csv
  auth:
    bootstrap:
      login: admin
  ai:
    enabled: false
    aws-region: ap-northeast-1
    model-id: jp.anthropic.claude-haiku-4-5-20251001-v1:0
    window-minutes: 30
    max-events: 60
    system-prompt-resource: classpath:prompts/watchpoint-system-prompt.txt
    max-output-tokens: 240
    schedule-interval: 30m
    initial-delay: 60s
    max-posts-per-day: 3
  survivor-karen:
    image-enabled: false
    image-interval-days: 3
    post-hour: 20
    schedule-cron: "0 */5 20-23 * * *"
    aws-region: us-east-1
    image-model-id: amazon.nova-canvas-v1:0
    image-prefix: watchpoint/posts/survivor-karen
  survivor-mark:
    post-hour: 20
    source-min-age-days: 2
    source-max-age-days: 5
    location-cooldown-days: 30
    schedule-cron: "0 */5 20-23 * * *"
