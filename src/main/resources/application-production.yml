spring:
  datasource:
    password: ${POSTGRES_PASSWORD}

server:
  port: 8082
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        secure: true

app:
  corekeeper:
    world-file: ${COREKEEPER_WORLD_FILE:/home/ec2-user/rubinco/servers/corekeeper/server-data/worlds/0.world.gzip}
    import-enabled: ${COREKEEPER_IMPORT_ENABLED:true}
  terraria:
    # Enable after TERRARIA_WORLD_FILE points at the server's .wld (docs/LUMINITE.md).
    import-enabled: ${TERRARIA_IMPORT_ENABLED:false}
    names-dir: ${TERRARIA_NAMES_DIR:/etc/rubinco/terraria-names}
  sevendays:
    environment-name: production
    mode: docker
    root: ${SEVEN_DAYS_ROOT:/home/ec2-user/7dtd}
    # Preserve the production template's serverconfig.xml location under data/.
    config-dir: ${SEVEN_DAYS_CONFIG_DIRECTORY:${app.sevendays.root}/data}
    telnet:
      enabled: ${SEVEN_DAYS_TELNET_ENABLED:true}
      password: ${SEVEN_DAYS_TELNET_PASSWORD:}
  auth:
    bootstrap:
      password: ${WATCHPOINT_BOOTSTRAP_PASSWORD:}
  ai:
    enabled: ${WATCHPOINT_AI_ENABLED:false}
  survivor-karen:
    image-enabled: ${SURVIVOR_KAREN_IMAGE_ENABLED:false}
    image-bucket: ${WATCHPOINT_IMAGE_BUCKET:}
    image-public-base-url: ${WATCHPOINT_IMAGE_PUBLIC_BASE_URL:}
