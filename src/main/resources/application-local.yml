spring:
  datasource:
    password: ${POSTGRES_PASSWORD:}

app:
  platform:
    portal-url: ${app.platform.auth-url}/portal
    watchpoint-url: ${app.platform.auth-url}/dashboard
    luminite-url: ${app.platform.auth-url}/luminite
    auth-url: http://localhost:${server.port:8080}
    api-url: ${app.platform.auth-url}/api
    allowed-origins:
      - ${app.platform.auth-url}
  sevendays:
    root: ${SEVEN_DAYS_ROOT:7dtd}
    telnet:
      password: ${SEVEN_DAYS_TELNET_PASSWORD:}
  auth:
    bootstrap:
      password: ${WATCHPOINT_BOOTSTRAP_PASSWORD:}
